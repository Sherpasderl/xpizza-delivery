# Portal 2b-2a — the merchant portal is its OWN Netlify site.
#
# Per the repo's deploy mechanics every folder is a separate site, so `publish = "."` with the site's
# base directory set to this folder — the same shape as xpizza-orders and la-musa-orders. (The plan
# said `publish = "xpizza-portal"`, which is the shape for a repo-root site; matching the sibling
# configs instead, because that is how the sites here are actually wired.)
#
# ⚠️ ALWAYS pass an explicit --site on any manual deploy. The repo links to a different site by
# default, and a portal deployed over another property is not a mistake anyone notices quickly.
[build]
  publish = "."
  command = "node ../platform/stamp-version.js"   # P-SELFUPDATE §1: /version.json + identity <meta>; never fails the build

[[headers]]
  for = "/*"
  [headers.values]
    # A strict CSP is affordable here because the shell has NO inline script or style — both were
    # extracted for exactly this reason. A page that handles credentials should not be asking for
    # 'unsafe-inline'.
    #
    #   script-src   the Firebase SDK is served from gstatic; nothing else may execute
    #   connect-src  identitytoolkit = sign-in, securetoken = token refresh, cloudfunctions = our reads.
    #                A stolen token is useless off-origin anyway (the server checks ownership), but this
    #                also means a compromised dependency cannot exfiltrate one to an arbitrary host.
    #   DISH PHOTOS B (PLAN-dish-photos §3, P2-10) — PATH-SCOPED Storage, nothing wider: img-src = blob: (the crop step's
    #                own file) + the PUBLIC photo bucket's photos/ prefix + the default bucket's drafts/ prefix (1 h signed GETs);
    #                connect-src = the default bucket's uploads/ prefix (E-P1's signed create-only PUT). Path-style URLs only.
    #                The public bucket name `sherpa-delivery-photos` was named by the owner 2026-11-11 (Sherpa is the umbrella; the
    #                bucket is created by the owner's runbook step): one constant here + its pin in portal-wiring.test.mjs.
    #   frame-src    ENVÍO (PLAN-portal-envio-step1 r2 §1): the Sherpa-admin delivery-fee map is its OWN site with its own Maps
    #                CSP — this shell only FRAMES it. Nothing else is framed; the shell's other directives are unchanged.
    #   frame-ancestors 'none'  the portal edits prices in later slices; it must never be framed
    #   base-uri / object-src / form-action  close the usual redirection and injection routes
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://us-central1-xpizza-delivery.cloudfunctions.net https://storage.googleapis.com/xpizza-delivery.firebasestorage.app/uploads/; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https://storage.googleapis.com/sherpa-delivery-photos/photos/ https://storage.googleapis.com/xpizza-delivery.firebasestorage.app/drafts/; frame-src https://sherpa-portal-map.netlify.app; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    # No full URL — and no restaurant id — leaks to a cross-origin third party.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # This is a private tool, not a page anyone should find.
    X-Robots-Tag = "noindex, nofollow"

# PLAN-portal-fonts r1.1 §2.3: the self-hosted font FILES are content-hashed (a new file = a new name), so they are cached
# forever. ONLY the hashed .woff2 — fonts/OFL.txt and portal-fonts.css keep Netlify's normal headers (as the forms do).
[[headers]]
  for = "/fonts/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single page: anything that is not a real file resolves to the shell rather than a Netlify 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
