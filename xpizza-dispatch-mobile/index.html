<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispatch · X. Pizza + La Musa</title>
<style>
  @font-face {
    font-family: 'Hanken Grotesk';
    font-weight: 400 700;
    font-display: swap;
    src: url('fonts/hankengrotesk-var.woff2') format('woff2');
  }
  /* ── Visual token layer — exact KDS status colors + both themes (spec §3.5) ──
     Dark board is the default (OS-dark or the toggle picks it); light is white-on-white.
     Component CSS below reads tokens ONLY, never raw hex. */
  :root{
    /* dark board (default) */
    --bg:#0e1013; --stage:#16181d; --card:#1c1f26; --card2:#22262e; --line:#2b3038;
    --ink:#f2f4f8; --ink-mute:#9aa1ac;
    --accent:#2c313a; --accent-fg:#f2f4f8; --sheet:#1a1d23;
    /* status — KDS-exact, plus the two mobile-only additions (KDS has no en-camino/done) */
    --nuevo:#6FBEEC; --prep:#6FBEEC; --listo:#46A24A; --camino:#6E77CC;
    --gold:#E6B93E; --done:#6f7681; --amber:#EE9F3C; --red:#C4392A;
    --ease:cubic-bezier(.22,.61,.36,1);
    --shadow:0 1px 3px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.25);
  }
  :root[data-theme="light"]{
    --bg:#f5f6f8; --stage:#eef0f3; --card:#ffffff; --card2:#f6f7f9; --line:#e6e8ec;
    --ink:#1b1e24; --ink-mute:#6b727c;
    --accent:#2c2a26; --accent-fg:#f7f4ee; --sheet:#ffffff;
    --done:#9aa1ac;
    --shadow:0 1px 2px rgba(20,24,31,.06), 0 8px 24px rgba(20,24,31,.06);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme]){
      --bg:#f5f6f8; --stage:#eef0f3; --card:#ffffff; --card2:#f6f7f9; --line:#e6e8ec;
      --ink:#1b1e24; --ink-mute:#6b727c; --accent:#2c2a26; --accent-fg:#f7f4ee; --sheet:#ffffff; --done:#9aa1ac;
      --shadow:0 1px 2px rgba(20,24,31,.06), 0 8px 24px rgba(20,24,31,.06);
    }
  }

  html,body{ margin:0; font-family:'Hanken Grotesk',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body{ background:var(--bg); color:var(--ink); transition:background .35s var(--ease), color .35s var(--ease); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  .full-screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .hidden{ display:none !important; }

  /* ── Login ── */
  .login-form{ display:flex; flex-direction:column; gap:10px; width:min(320px,86vw); }
  .login-form h2{ margin:0 0 6px; font-weight:700; letter-spacing:-.02em; }
  .login-form input{ padding:13px 14px; font:inherit; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:12px; }
  .login-form button{ padding:13px; font:inherit; font-weight:600; color:var(--accent-fg);
    background:var(--accent); border:none; border-radius:12px; cursor:pointer; }
  #login-error{ color:var(--red); font-size:13px; min-height:16px; text-align:center; }

  /* ── App shell: header (top) · panes (scroll) · tab bar (bottom) ── */
  #screen-main{ flex-direction:column; align-items:stretch; justify-content:flex-start; background:var(--bg); }
  #app-header{ display:flex; align-items:center; gap:9px; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    border-bottom:1px solid var(--line); background:var(--bg); }
  .dl-title{ font-weight:700; font-size:19px; letter-spacing:-.02em; }
  .live-dot{ width:8px; height:8px; border-radius:50%; background:var(--listo);
    box-shadow:0 0 0 0 color-mix(in srgb, var(--listo) 55%, transparent); animation:pulse 2.4s var(--ease) infinite; }
  .live-dot.stale{ background:var(--ink-mute); animation:none; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--listo) 55%, transparent);} 70%{ box-shadow:0 0 0 7px transparent;} 100%{ box-shadow:0 0 0 0 transparent;} }
  #theme-toggle{ margin-left:auto; display:grid; place-items:center; width:38px; height:38px; padding:0;
    color:var(--ink-mute); background:transparent; border:1px solid var(--line); border-radius:11px; cursor:pointer;
    transition:color .25s var(--ease), border-color .25s var(--ease); }
  #theme-toggle:active{ color:var(--ink); }

  main{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:14px 14px calc(env(safe-area-inset-bottom) + 78px); }
  .tab-pane{ animation:fade .32s var(--ease); }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none;} }

  #tabbar{ position:fixed; left:0; right:0; bottom:0; display:flex; z-index:20;
    padding:6px 10px calc(env(safe-area-inset-bottom) + 6px); gap:6px;
    background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(14px) saturate(1.2);
    border-top:1px solid var(--line); }
  .tab-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px;
    font:inherit; font-size:11px; font-weight:600; color:var(--ink-mute); background:transparent; border:none;
    border-radius:12px; cursor:pointer; transition:color .25s var(--ease); }
  .tab-btn[aria-selected="true"]{ color:var(--ink); }
  .tab-btn svg{ opacity:.9; }
</style>
</head>
<body>
  <div id="screen-login" class="full-screen hidden">
    <div class="login-form">
      <h2>Dispatch</h2>
      <input type="email" id="login-email" placeholder="email" autocomplete="email">
      <input type="password" id="login-password" placeholder="contraseña" autocomplete="current-password">
      <button id="login-btn">Entrar</button>
      <div id="login-error"></div>
    </div>
  </div>

  <div id="screen-main" class="full-screen hidden">
    <header id="app-header">
      <span class="dl-title">Dispatch</span>
      <span id="live-dot" class="live-dot" title="en vivo"></span>
      <button id="theme-toggle" aria-label="Cambiar tema">
        <!-- sun/moon line icon, stroke 1.7, currentColor -->
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg>
      </button>
    </header>

    <main>
      <section id="tab-pedidos" class="tab-pane"></section>
      <section id="tab-mapa" class="tab-pane hidden"></section>
    </main>

    <nav id="tabbar">
      <button class="tab-btn" data-tab="pedidos" aria-selected="true">
        <!-- receipt line icon -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M6 3h12v18l-2.2-1.5L13.6 21 12 19.5 10.4 21 8.2 19.5 6 21z"/><path d="M9 8h6M9 12h6"/></svg>
        <span>Pedidos</span>
      </button>
      <button class="tab-btn" data-tab="mapa" aria-selected="false">
        <!-- folded-map line icon -->
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M9 4 3 6.2v13.6L9 18l6 2 6-2.2V4.2L15 6 9 4z"/><path d="M9 4v14M15 6v14"/></svg>
        <span>Mapa</span>
      </button>
    </nav>
  </div>

<script type="module">
import * as XPD from './xpizza-delivery.js';

// apiKey is NOT a secret — it identifies the project; real access is gated by Auth + RTDB rules.
// Copied verbatim from xpizza-dispatch/index.html's firebaseConfig block.
const firebaseConfig = {
  apiKey: "AIzaSyDWFYrzHvaNnRZERbN8jIuAzkY85daFJXU",
  authDomain: "xpizza-delivery.firebaseapp.com",
  databaseURL: "https://xpizza-delivery-default-rtdb.firebaseio.com",
  projectId: "xpizza-delivery",
  messagingSenderId: "185867271616",
  appId: "1:185867271616:web:84bb37552b40c1d517dc25"
};

const $ = (id) => document.getElementById(id);
const show = (which) => {
  $('screen-login').classList.toggle('hidden', which !== 'login');
  $('screen-main').classList.toggle('hidden', which !== 'main');
};

XPD.initDelivery(firebaseConfig);

XPD.onAuth((user) => {
  // Staff-only surface. A customer token can technically auth but the RTDB rules
  // deny /orders + /drivers reads (auth.token.customer !== true), so the board stays empty.
  if (!user) { show('login'); return; }
  show('main');
  window.__startApp?.();   // later tasks define __startApp (subscriptions + render)
});

$('login-btn').addEventListener('click', async () => {
  const email = $('login-email').value.trim();
  const password = $('login-password').value;
  if (!email || !password) { $('login-error').textContent = 'Email y contraseña requeridos'; return; }
  $('login-btn').disabled = true;
  try {
    await XPD.signIn(email, password);
  } catch (e) {
    const code = String(e?.code || e);
    $('login-error').textContent = /invalid-credential|wrong-password|user-not-found/.test(code)
      ? 'Credenciales inválidas' : 'No se pudo iniciar sesión';
  } finally {
    $('login-btn').disabled = false;
  }
});

// ── Theme (light/dark) — persists to localStorage; CSS media default rules until a choice is made ──
window.__setTheme = (mode) => {
  document.documentElement.setAttribute('data-theme', mode);
  try { localStorage.setItem('dl-theme', mode); } catch {}
};
(() => {
  const saved = (() => { try { return localStorage.getItem('dl-theme'); } catch { return null; } })();
  if (saved) document.documentElement.setAttribute('data-theme', saved); // else CSS media default rules
  $('theme-toggle').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    window.__setTheme(cur === 'dark' ? 'light' : 'dark');
  });
})();

// ── Two-tab switch — cross-fades the panes, updates the bottom bar ──
window.__showTab = (which) => {
  document.querySelectorAll('.tab-btn').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.tab === which)));
  $('tab-pedidos').classList.toggle('hidden', which !== 'pedidos');
  $('tab-mapa').classList.toggle('hidden', which !== 'mapa');
  if (which === 'mapa') window.__onMapaShown?.();   // Task 6 lazy-inits Maps here
};
document.querySelectorAll('.tab-btn').forEach(b =>
  b.addEventListener('click', () => window.__showTab(b.dataset.tab)));
</script>
</body>
</html>
