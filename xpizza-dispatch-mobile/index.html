<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- FIRST-PAINT root background: on an iOS installed PWA the screen is taller than the web viewport
     (e.g. 852 vs 793) and iOS paints the out-of-bounds bottom strip itself, sampling the DOCUMENT-ROOT
     background at first paint — BEFORE the main <style> applies. This tiny style must come first so
     <html> already carries --bg the instant iOS samples it (else the strip renders grey). -->
<style>html{background:#f5f6f8}@media(prefers-color-scheme:dark){html{background:#0e1013}}</style>
<title>Dispatch · X. Pizza + La Musa</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e1013" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dispatch">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  @font-face {
    font-family: 'Hanken Grotesk';
    font-weight: 400 700;
    font-display: swap;
    src: url('fonts/hankengrotesk-var.woff2') format('woff2');
  }
  /* ── Visual token layer — exact KDS status colors + both themes (spec §3.5) ──
     Dark board is the default (OS-dark or the toggle picks it); light is white-on-white.
     Component CSS below reads tokens ONLY, never raw hex. */
  :root{
    /* dark board (default) */
    --bg:#0e1013; --stage:#16181d; --card:#1c1f26; --card2:#22262e; --line:#2b3038;
    --ink:#f2f4f8; --ink-mute:#9aa1ac;
    --accent:#2c313a; --accent-fg:#f2f4f8; --sheet:#1a1d23;
    /* status — KDS-exact, plus the two mobile-only additions (KDS has no en-camino/done) */
    --nuevo:#6FBEEC; --prep:#6FBEEC; --listo:#46A24A; --camino:#6E77CC;
    --gold:#E6B93E; --done:#6f7681; --amber:#EE9F3C; --red:#C4392A;
    /* mockup aliases (r2 — match the approved mockup verbatim): muted/dim ink, GPS vivo/inact,
       scheduled gold, pin ink, brand accents. */
    --mut:#9aa3b0; --dim:#6b7481; --vivo:#3ecb6e; --inact:#e0a73c; --prog:#E6B93E; --pin-ink:#0c1116;
    --xp:#e8543a; --lm:#d7a94b;
    --ease:cubic-bezier(.22,.61,.36,1);
    --shadow:0 1px 3px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.25);
  }
  :root[data-theme="light"]{
    --bg:#f5f6f8; --stage:#eef0f3; --card:#ffffff; --card2:#f6f7f9; --line:#e6e8ec;
    --ink:#1b1e24; --ink-mute:#6b727c;
    --accent:#2c2a26; --accent-fg:#f7f4ee; --sheet:#ffffff;
    --done:#9aa1ac;
    --mut:#6b7280; --dim:#9ca3af; --vivo:#38ab68; --inact:#d19640; --pin-ink:#1b1e24;
    --xp:#cb604a; --lm:#bd8c37;
    --shadow:0 1px 2px rgba(20,24,31,.06), 0 8px 24px rgba(20,24,31,.06);
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme]){
      --bg:#f5f6f8; --stage:#eef0f3; --card:#ffffff; --card2:#f6f7f9; --line:#e6e8ec;
      --ink:#1b1e24; --ink-mute:#6b727c; --accent:#2c2a26; --accent-fg:#f7f4ee; --sheet:#ffffff; --done:#9aa1ac;
      --mut:#6b7280; --dim:#9ca3af; --vivo:#38ab68; --inact:#d19640; --pin-ink:#1b1e24; --xp:#cb604a; --lm:#bd8c37;
      --shadow:0 1px 2px rgba(20,24,31,.06), 0 8px 24px rgba(20,24,31,.06);
    }
  }

  /* Solid --bg on the root + body so the Android dynamic-viewport gesture-nav inset never exposes a
     grey band behind the shell/tab-bar; color-scheme keeps the UA overscroll canvas on-theme. */
  html{ background:var(--bg); color-scheme:dark light; }
  :root[data-theme="light"]{ color-scheme:light; }
  html,body{ margin:0; min-height:100dvh; font-family:'Hanken Grotesk',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  body{ background:var(--bg); color:var(--ink); min-height:100dvh; transition:background .35s var(--ease), color .35s var(--ease); }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  .full-screen{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .hidden{ display:none !important; }

  /* ── Login ── */
  .login-form{ display:flex; flex-direction:column; gap:10px; width:min(320px,86vw); }
  .login-form h2{ margin:0 0 6px; font-weight:700; letter-spacing:-.02em; }
  .login-form input{ padding:13px 14px; font:inherit; color:var(--ink); background:var(--card);
    border:1px solid var(--line); border-radius:12px; }
  .login-form button{ padding:13px; font:inherit; font-weight:600; color:var(--accent-fg);
    background:var(--accent); border:none; border-radius:12px; cursor:pointer; }
  #login-error{ color:var(--red); font-size:13px; min-height:16px; text-align:center; }

  /* ── App shell — a 100dvh flex COLUMN so the tab bar is a real flex child at the true bottom (NOT
     position:fixed). This kills the fresh-load grey band (a fixed bar anchored to the layout viewport
     before the URL bar collapsed). header (fixed height) · main (flex:1, scrolls) · tab bar (flex:none). */
  /* iOS standalone PWA miscomputes viewport height at first paint (100dvh AND inset:0 both leave the
     shell short → a grey band below it that only fills after the first scroll). The reliable fix is to
     PIN the height in JS from window.visualViewport.height (see __fitShell). This top-anchored 100dvh is
     only the pre-JS fallback; __fitShell overrides the exact px height. */
  #screen-main{ position:fixed; top:0; left:0; right:0; bottom:auto; height:100dvh; flex-direction:column;
    align-items:stretch; justify-content:flex-start; background:var(--bg); overflow:hidden; }

  /* topbar — mockup .apphead (per-tab title + subtitle + En-vivo dot + theme toggle) */
  .apphead{ flex:0 0 auto; padding:calc(env(safe-area-inset-top) + 6px) 18px 12px; display:flex;
    align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); }
  .apphead .t{ font-size:24px; font-weight:800; letter-spacing:-.026em; line-height:1.04; }
  .apphead .sub{ font-size:13px; color:var(--mut); margin-top:3px; font-weight:600; letter-spacing:.004em; }
  .head-r{ display:flex; align-items:center; gap:12px; }
  .theme-btn{ width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--stage);
    color:var(--ink); display:grid; place-items:center; cursor:pointer; padding:0; }
  .theme-btn svg{ width:17px; height:17px; }
  .live-dot{ display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--mut); font-weight:600; white-space:nowrap; }
  .live-dot i{ width:7px; height:7px; border-radius:50%; background:var(--vivo); animation:pulse 2s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--vivo) 55%, transparent);} 70%{ box-shadow:0 0 0 6px transparent;} 100%{ box-shadow:0 0 0 0 transparent;} }

  main{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 14px 18px; }
  .tab-pane{ animation:fade .32s var(--ease); }
  @keyframes fade{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none;} }

  #tabbar{ flex:0 0 auto; display:flex; gap:6px; padding:6px 10px calc(env(safe-area-inset-bottom) + 6px);
    background:var(--bg); border-top:1px solid var(--line); }
  .tab-btn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px;
    font:inherit; font-size:11px; font-weight:600; color:var(--mut); background:transparent; border:none;
    border-radius:12px; cursor:pointer; transition:color .25s var(--ease); }
  .tab-btn[aria-selected="true"]{ color:var(--ink); }
  .tab-btn svg{ opacity:.9; }

  /* ── Chip bar ── */
  .chipbar{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; margin:0 -2px 4px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch; }
  .chipbar::-webkit-scrollbar{ display:none; }
  .chip{ flex:0 0 auto; display:inline-flex; align-items:center; gap:6px; padding:9px 14px; font:inherit;
    font-size:14px; font-weight:600; color:var(--ink-mute); background:var(--card); border:1px solid var(--line);
    border-radius:999px; cursor:pointer; white-space:nowrap; transition:background .22s var(--ease), color .22s var(--ease), border-color .22s var(--ease); }
  .chip.on{ background:var(--accent); color:var(--accent-fg); border-color:transparent; }
  .chip .ct{ font-variant-numeric:tabular-nums; font-size:13px; color:var(--ink-mute); }
  .chip.on .ct{ color:var(--accent-fg); opacity:.85; }
  .chip .ct.attn{ color:var(--listo); }
  .chip.on .ct.attn{ color:var(--accent-fg); }
  .chip .chk{ display:inline-grid; place-items:center; font-size:11px; line-height:1; }
  .attn-dot{ width:7px; height:7px; border-radius:50%; background:var(--listo); }

  /* ── Sections — mockup .sec-h (chevron LEFT · stripe · UPPERCASE name · count pill right) ── */
  .sec{ margin:0 0 14px; }
  .sec-h{ display:flex; align-items:center; gap:10px; padding:10px 6px; cursor:pointer; user-select:none;
    width:100%; background:transparent; border:none; text-align:left; }
  .sec-h .chev{ width:15px; height:15px; color:var(--dim); transition:transform .2s; flex:0 0 auto; }
  .sec.collapsed .chev{ transform:rotate(-90deg); }
  .sec-h .stripe{ width:9px; height:9px; border-radius:3px; flex:0 0 auto; }
  .sec-h .name{ font-size:14.5px; font-weight:800; letter-spacing:.095em; text-transform:uppercase; color:var(--ink); }
  .sec.prog .sec-h .name{ color:var(--prog); }
  .sec-h .cnt{ margin-left:auto; font-size:13px; font-weight:800; color:var(--mut); background:var(--stage);
    border:1px solid var(--line); border-radius:20px; padding:2px 9px; min-width:24px; text-align:center; }
  .sec.collapsed .sec-body{ display:none; }
  .sec-body{ display:flex; flex-direction:column; gap:9px; padding-top:4px; }
  .slot{ margin:0 0 6px; }
  .slot h4{ margin:8px 2px 6px; font-size:12px; font-weight:700; color:var(--gold); letter-spacing:.01em; }

  /* ── Order card ── */
  .card{ position:relative; padding:12px 13px 11px 15px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; box-shadow:var(--shadow); overflow:hidden; cursor:pointer;
    transition:transform .12s var(--ease), border-color .2s var(--ease); }
  .card:active{ transform:scale(.992); }
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--edge, var(--line)); }
  .card-head{ display:flex; align-items:baseline; gap:8px; }
  .card-head .cust{ font-weight:700; font-size:17px; letter-spacing:-.01em; }
  .card-head .onum{ font-size:14.5px; font-weight:600; color:var(--ink-mute); font-variant-numeric:tabular-nums; }
  .card-head .age{ margin-left:auto; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums;
    padding:2px 8px; border-radius:999px; background:color-mix(in srgb, currentColor 12%, transparent); }
  .card-head .age.muted{ color:var(--ink-mute); font-weight:600; background:transparent; padding:2px 0; }
  .card-items{ margin:5px 0 0; font-size:14.5px; color:var(--ink-mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-foot{ display:flex; align-items:center; gap:8px; margin-top:9px; }
  .card-foot .tag{ font-size:12px; font-weight:600; color:var(--ink-mute); padding:3px 9px; border-radius:7px;
    background:var(--card2); border:1px solid var(--line); }
  .card-foot .brand{ font-size:12px; font-weight:600; color:var(--ink-mute); }
  .card-foot .drv{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; color:var(--ink); }
  .card-foot .mappin{ margin-left:auto; display:grid; place-items:center; width:32px; height:32px; padding:0;
    color:var(--ink-mute); background:transparent; border:1px solid var(--line); border-radius:9px; cursor:pointer; }
  .card-foot .mappin:active{ color:var(--ink); }
  .gps{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .gps.live{ background:var(--listo); }
  .gps.stale{ background:var(--ink-mute); }

  .empty{ padding:18px 2px; font-size:13px; color:var(--ink-mute); text-align:center; }

  /* ── Drivers roster (r2-C, Option 1) — mockup .drow/.gpspill/.dord + .rsec reuses .sec-h.
     NOTE: the pill is .gpspill, NOT .gps — .gps is the 7×7 order-card liveness DOT above; sharing the
     name clamped the roster pill to 7px and overlapped the order#. ── */
  .roster{ padding:4px 0 6px; }
  .drow{ display:flex; align-items:center; gap:11px; margin:0 0 8px; padding:12px 13px; background:var(--card);
    border:1px solid var(--line); border-radius:14px; cursor:pointer; transition:background-color .2s var(--ease), transform .12s var(--ease); }
  .drow:active{ background:var(--card2); transform:scale(.99); }
  .dstat{ width:11px; height:11px; border-radius:50%; flex:0 0 auto; }
  .dinfo{ flex:1; min-width:0; }
  .dnm{ font-size:15px; font-weight:700; letter-spacing:-.012em; }
  .dsub{ font-size:12px; color:var(--mut); margin-top:2px; font-weight:600; }
  .dright{ display:flex; align-items:center; gap:9px; flex:0 0 auto; }
  .gpspill{ flex:0 0 auto; white-space:nowrap; font-size:10px; font-weight:800; padding:3px 8px 3px 7px; border-radius:20px; display:inline-flex; align-items:center; gap:5px; letter-spacing:.01em; }
  .gpspill::before{ content:""; width:6px; height:6px; border-radius:50%; flex:0 0 auto; }
  .gpspill.vivo{ color:var(--vivo); background:color-mix(in srgb,var(--vivo) 14%,transparent); }
  .gpspill.vivo::before{ background:var(--vivo); }
  .gpspill.inact{ color:var(--inact); background:color-mix(in srgb,var(--inact) 16%,transparent); }
  .gpspill.inact::before{ background:var(--inact); }
  .dord{ flex:0 0 auto; white-space:nowrap; font-size:13px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; min-width:38px; text-align:right; }
  .dord.dash{ color:var(--dim); font-weight:700; }
  .rsec{ margin:0 0 10px; }
  .rsec .sec-h{ cursor:default; }

  /* ── Mapa — a fixed layer between the header and the tab bar (ignores board scroll) ── */
  #tab-mapa{ animation:none; }   /* the map layer is fixed; skip the pane fade so tiles don't reflow */
  .map-wrap{ position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top) + 62px);
    bottom:calc(env(safe-area-inset-bottom) + 70px); }
  #map{ position:absolute; inset:0; background:var(--stage); }
  #ver-todos{ position:absolute; top:12px; right:12px; z-index:5; padding:9px 14px; font:inherit;
    font-size:13px; font-weight:600; color:var(--ink); background:color-mix(in srgb, var(--card) 92%, transparent);
    border:1px solid var(--line); border-radius:999px; box-shadow:var(--shadow); cursor:pointer; }
  .map-msg{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:5; max-width:80%;
    padding:9px 14px; font-size:13px; color:var(--ink); background:var(--card); border:1px solid var(--line);
    border-radius:12px; box-shadow:var(--shadow); text-align:center; }

  /* ── Bottom sheet + scrim + toast — mockup sheets (.grab/.sh-body/.kv/.status-row/.btn/.dpick/.confirm-flow) ── */
  #scrim{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.45); opacity:0; visibility:hidden;
    transition:opacity .28s var(--ease), visibility .28s var(--ease); }
  #scrim.on{ opacity:1; visibility:visible; }
  #sheet{ position:fixed; left:0; right:0; bottom:0; z-index:41; background:var(--sheet); color:var(--ink);
    border-radius:24px 24px 0 0; box-shadow:0 -8px 44px -14px rgba(0,0,0,.55); max-height:88vh;
    display:flex; flex-direction:column; border-top:1px solid var(--line);
    transform:translateY(101%); transition:transform .34s var(--ease); }
  #sheet.on{ transform:translateY(0); }
  .grab{ width:38px; height:5px; border-radius:3px; background:var(--line); margin:9px auto 3px; flex:0 0 auto; }
  .sh-body{ overflow-y:auto; padding:6px 18px calc(env(safe-area-inset-bottom) + 24px); }
  .sh-body::-webkit-scrollbar{ width:0; }
  .sh-title{ font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .sh-sub{ font-size:12.5px; color:var(--mut); margin-top:2px; }
  .brand{ font-size:9.5px; font-weight:800; letter-spacing:.03em; padding:2px 6px; border-radius:5px; text-transform:uppercase; flex:0 0 auto; }
  .brand.xp{ color:var(--xp); background:color-mix(in srgb,var(--xp) 14%,transparent); }
  .brand.lm{ color:var(--lm); background:color-mix(in srgb,var(--lm) 14%,transparent); }
  .kv{ display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
  .kv .k{ color:var(--mut); } .kv .v{ font-weight:600; text-align:right; }
  .items-box{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin:12px 0; }
  .status-row{ display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin:12px 0; }
  .status-row .av{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:800; color:var(--pin-ink); font-size:15px; flex:0 0 auto; }
  .btn{ display:block; width:100%; text-align:center; padding:14px; border-radius:14px; font-size:15px; font-weight:800; border:none; cursor:pointer; margin-top:10px; }
  .btn-primary{ background:var(--accent); color:var(--accent-fg); }
  .btn-ghost{ background:transparent; color:var(--mut); border:1px solid var(--line); }
  .btn-warn{ background:var(--camino); color:#fff; }
  .btn:disabled{ opacity:.55; }
  .mini-map{ height:150px; border-radius:14px; overflow:hidden; border:1px solid var(--line); margin:10px 0 14px; position:relative; background:var(--stage); }
  .mini-map img{ width:100%; height:100%; object-fit:cover; display:block; }
  .pick-label{ font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:var(--mut); margin:2px 2px 9px; }
  .dpick{ display:flex; align-items:center; gap:11px; padding:12px; border:1px solid var(--line); border-radius:13px; margin-bottom:9px; cursor:pointer; background:var(--card); }
  .dpick:active{ background:var(--card2); }
  .dpick.current{ border-color:var(--inact); cursor:default; }
  .dpick .av{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:800; color:var(--pin-ink); font-size:14px; flex:0 0 auto; }
  .dpick .info{ flex:1; min-width:0; }
  .dpick .dn{ font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:7px; }
  .dpick .ds{ font-size:11.5px; color:var(--mut); margin-top:2px; }
  .dpick .meta{ text-align:right; font-size:11.5px; color:var(--mut); font-weight:700; flex:0 0 auto; }
  .dpick .meta .dist{ color:var(--ink); font-size:14px; }
  .tagcur{ font-size:9.5px; font-weight:800; color:var(--inact); background:color-mix(in srgb,var(--inact) 15%,transparent); border:1px solid color-mix(in srgb,var(--inact) 35%,transparent); padding:1px 6px; border-radius:5px; }
  .tagfree{ font-size:9.5px; font-weight:800; color:var(--vivo); background:color-mix(in srgb,var(--vivo) 14%,transparent); padding:1px 6px; border-radius:5px; }
  .confirm-flow{ display:flex; align-items:center; justify-content:center; gap:12px; margin:18px 0; }
  .cf-node{ text-align:center; }
  .cf-av{ width:52px; height:52px; border-radius:50%; display:grid; place-items:center; font-weight:800; color:var(--pin-ink); font-size:19px; margin:0 auto 6px; }
  .cf-nm{ font-size:12px; font-weight:700; }
  .cf-arrow{ color:var(--mut); font-size:22px; }
  .cf-note{ font-size:12.5px; color:var(--mut); text-align:center; margin-bottom:6px; }
  /* Itemized order summary (KDS-style, kept): qty× name + red "↳ extras" sub-lines, inside .items-box. */
  .detail-items{ display:flex; flex-direction:column; gap:3px; }
  .dl-item{ display:flex; align-items:baseline; gap:9px; font-size:14.5px; color:var(--ink); line-height:1.4; }
  .dl-item.muted{ color:var(--mut); font-size:13.5px; }
  .dl-qty{ font-weight:700; color:var(--mut); font-variant-numeric:tabular-nums; min-width:26px; }
  .dl-extra{ font-size:12.5px; color:var(--red); margin:0 0 2px 35px; line-height:1.3; }
  .dl-extra-tag{ color:var(--mut); font-size:12px; font-weight:600; }

  #toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 84px); transform:translateX(-50%) translateY(12px);
    z-index:50; max-width:82vw; padding:11px 16px; font-size:14px; font-weight:600; color:var(--accent-fg);
    background:var(--accent); border-radius:12px; box-shadow:var(--shadow); opacity:0; visibility:hidden;
    transition:opacity .25s var(--ease), transform .25s var(--ease), visibility .25s var(--ease); }
  #toast.on{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }
  #toast.error{ background:var(--red); color:#fff; }
</style>
</head>
<body>
  <div id="screen-login" class="full-screen hidden">
    <div class="login-form">
      <h2>Dispatch</h2>
      <input type="email" id="login-email" placeholder="email" autocomplete="email">

// ── small helpers ──
function escapeHtml(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' })[c]);
}
// Human-facing label — '#<display_number>' once the server allocates one, else a short order-id
// fallback. DISPLAY ONLY (mirrors the desktop's displayOrderLabel); never used as a key/selector/arg.
function displayLabel(id, order){
  const dn = order && order.display_number;
  if (Number.isFinite(dn)) return '#' + dn;
  const s = id != null ? String(id) : '';
  return s ? '#' + s.slice(-4).toUpperCase() : '#—';
}
function oneLineItems(order){ return (order && order.items_text) ? String(order.items_text) : '—'; }

// Itemized order summary for the detail sheet — qty× name + "↳ extras" per line, matching the KDS card.
// Ported from xpizza-kitchen renderItems (the canonical consumer of items_text): parses the same
// ' | '-joined "Nx Name (Lprice) [extras]" string the KDS parses, so the phone reads identically to the
// kitchen screen. (Structured order.items is id-keyed for La Musa → names need the menu we don't bundle;
// summary_lines is rewards-only. items_text is present on every order, both brands, name-resolved.)
function renderOrderItems(order){
  const itemsText = order && order.items_text;
  if (!itemsText || itemsText === '—') return '<div class="dl-item muted">Sin detalle del pedido</div>';
  // Split items by ' | ' but NOT inside [] (extras).
  const parts = [];
  let depth = 0, cur = '';
  for (let i = 0; i < itemsText.length; i++) {
    const c = itemsText[i];
    if (c === '[') depth++;
    else if (c === ']') depth--;
    if (depth === 0 && itemsText.slice(i, i + 3) === ' | ') { parts.push(cur.trim()); cur = ''; i += 2; }
    else cur += c;
  }
  if (cur.trim()) parts.push(cur.trim());

  return parts.map(part => {
    // Qty, Name, optional (Lprice), optional [extras]
    const m = part.match(/^(\d+)x\s+(.+?)(?:\s+\(L[\d.]+\))?(?:\s+\[(.+)\])?$/);
    if (!m) return `<div class="dl-item"><span>${escapeHtml(part)}</span></div>`;
    const qty = parseInt(m[1], 10);
    const name = escapeHtml(m[2]);
    const extrasRaw = m[3] ? escapeHtml(m[3]) : m[3];
    let extrasHtml = '';
    if (extrasRaw) {
      if (extrasRaw.includes('Pizza ')) {
        // Per-instance "Pizza N:" extras. Strip the prefix only when qty===1 (else it says WHICH one).
        const perPizza = extrasRaw.split(/\s*\|\s*(?=Pizza \d)/);
        if (qty === 1) {
          extrasHtml = `<div class="dl-extra">↳ ${perPizza[0].replace(/^Pizza \d+:\s*/, '').trim()}</div>`;
        } else {
          const allSame = perPizza.length === qty && perPizza.every((p, i, arr) =>
            p.replace(/^Pizza \d+:\s*/, '').trim() === arr[0].replace(/^Pizza \d+:\s*/, '').trim());
          extrasHtml = allSame
            ? `<div class="dl-extra">↳ ${perPizza[0].replace(/^Pizza \d+:\s*/, '').trim()} <span class="dl-extra-tag">(todas)</span></div>`
            : perPizza.map(p => `<div class="dl-extra">↳ ${p.trim()}</div>`).join('');
        }
      } else {
        extrasHtml = `<div class="dl-extra">↳ ${extrasRaw}</div>`;
      }
    }
    return `<div class="dl-item"><span class="dl-qty">${qty}×</span><span>${name}</span></div>${extrasHtml}`;
  }).join('');
}

const SECTION_LABELS = { nuevos:'Nuevos', preparacion:'En preparación', listos:'Listos', camino:'En camino', completados:'Completados' };
const SECTION_VAR = { nuevos:'--nuevo', preparacion:'--prep', listos:'--listo', camino:'--camino', completados:'--done', gold:'--gold' };
function statusColorVar(section){ return SECTION_VAR[section] || '--line'; }

const CARET_SVG = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const PIN_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 21s6-5.2 6-10a6 6 0 1 0-12 0c0 4.8 6 10 6 10z"/><circle cx="12" cy="11" r="2.2"/></svg>';

// ── chip bar — Todos · Sin asignar · Delivery · Pickup · Programados ──
const CHIPS = [
  { key:'todos', label:'Todos' },
  { key:'unassigned', label:'Sin asignar', attn:true },
  { key:'delivery', label:'Delivery' },
  { key:'pickup', label:'Pickup' },
  { key:'programados', label:'Programados' },
];
function renderChips(counts){
  return CHIPS.map(c => {
    const active = activeChip === c.key;
    const n = counts[c.key] ?? 0;
    const dot = (c.attn && !active && n > 0) ? '<span class="attn-dot"></span>' : '';
    const check = active ? '<span class="chk">✓</span>' : '';
    const countCls = c.attn ? 'ct attn' : 'ct';
    return `<button class="chip${active?' on':''}" data-chip="${c.key}">${check}${dot}${escapeHtml(c.label)} <span class="${countCls}">${n}</span></button>`;
  }).join('');
}

// ── driver name + GPS-liveness dot on an assigned delivery card ──
function driverLabel(orderId){
  const drvId = assignedDriverId(orderId, STORE.tasks);
  if (!drvId) return '';
  const d = STORE.drivers[drvId];
  const name = d?.name || 'Repartidor';
  const live = d && !XPD.isStalePing(d.last_ping);
  return `<span class="drv"><span class="gps ${live?'live':'stale'}"></span>${escapeHtml(name)}</span>`;
}

// ── one order card ──
function orderCard(id, order, now){
  const section = sectionForOrder(order);
  const brand = order.restaurant_id === 'la_musa' ? 'La Musa' : 'X. Pizza';
  const type = order.order_type === 'pickup' ? 'Recoge el cliente' : 'Delivery';
  const secs = agingSeconds(agingBaselineMs(order), now);
  // Aging cue: ONLY Nuevos/En preparación heat up (spec §3.5). dispatch-aging.agingBand returns
  // 'green'|'amber'|'red'; pass the spec thresholds (amber 8min / red 15min). The card edge heats too.
  const heats = section === 'nuevos' || section === 'preparacion';
  const band = heats ? agingBand(secs, { amber: 480, red: 900 }) : 'green';
  const bandVar = band === 'red' ? '--red' : band === 'amber' ? '--amber' : statusColorVar(section);
  const edgeVar = heats ? bandVar : statusColorVar(section);
  const ageChip = heats
    ? `<span class="age" style="color:var(${bandVar})">${formatAging(secs)}</span>`
    : `<span class="age muted">${formatAging(secs)}</span>`;
  const pin = `<button class="mappin" data-order="${id}" aria-label="Ver en mapa">${PIN_SVG}</button>`;
  return `
    <article class="card" style="--edge:var(${edgeVar})" data-order="${id}">
      <div class="card-head">
        <span class="cust">${escapeHtml(order.customer_name || 'Cliente')}</span>
        <span class="onum">${escapeHtml(displayLabel(id, order))}</span>
        ${ageChip}
      </div>
      <div class="card-items">${escapeHtml(oneLineItems(order))}</div>
      <div class="card-foot">
        <span class="tag">${escapeHtml(type)}</span><span class="brand">${escapeHtml(brand)}</span>
        ${driverLabel(id)}
        ${order.order_type === 'delivery' ? pin : ''}
      </div>
    </article>`;
}

function sectionBlock(label, innerHTML, sectionKey, count){
  const isCollapsed = collapsed.has(label);
  const cnt = (count != null) ? `<span class="cnt">${count}</span>` : '';
  const isProg = sectionKey === 'gold';
  return `<section class="sec${isProg?' prog':''}${isCollapsed?' collapsed':''}" data-sec="${escapeHtml(label)}">
    <div class="sec-h">
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      <span class="stripe" style="background:var(${statusColorVar(sectionKey)})"></span>
      <span class="name">${escapeHtml(label)}</span>
      ${cnt}
    </div>
    <div class="sec-body">${innerHTML}</div>
  </section>`;
}
function emptyState(text){ return `<div class="empty">${escapeHtml(text)}</div>`; }

function renderBoard(){
  if (!started) return;
  const now = Date.now();
  const counts = chipCounts(STORE.orders, STORE.tasks, Object.keys(STORE.scheduled).length);
  const chipBar = `<div class="chipbar">${renderChips(counts)}</div>`;

  // Topbar subtitle — live count of in-flight (non-completed) board orders + distinct brands among them.
  const activeIds = Object.keys(STORE.orders).filter(id => { const s = sectionForOrder(STORE.orders[id]); return s && s !== 'completados'; });
  const brands = new Set(activeIds.map(id => STORE.orders[id].restaurant_id).filter(Boolean));
  const hs = $('head-sub');
  if (hs) hs.textContent = `${activeIds.length} activo${activeIds.length===1?'':'s'} · ${brands.size} marca${brands.size===1?'':'s'}`;

  let body = '';
  if (activeChip === 'programados') {
    const groups = groupScheduledBySlot(STORE.scheduled, now);
    body = groups.length
      ? groups.map(g => sectionBlock(g.label, g.orders.map(({id,order}) => orderCard(id, order, now)).join(''), 'gold', g.orders.length)).join('')
      : emptyState('Sin pedidos programados');
  } else {
    // live sections
    const ids = Object.keys(STORE.orders).filter(id =>
      matchesChip(STORE.orders[id], id, STORE.tasks, activeChip));
    const bySection = Object.fromEntries(SECTIONS.map(s => [s, []]));
    for (const id of ids) {
      const sec = sectionForOrder(STORE.orders[id]);
      if (sec) bySection[sec].push(id);
    }
    body = SECTIONS.map(sec => {
      const list = bySection[sec].sort((a,b) => orderCompare(STORE.orders[a], STORE.orders[b]));
      if (!list.length && activeChip !== 'todos') return '';   // hide empty under a filter
      const cards = list.map(id => orderCard(id, STORE.orders[id], now)).join('') || emptyState('—');
      return sectionBlock(SECTION_LABELS[sec], cards, sec, list.length);
    }).join('');
    // Programados section sits LAST on Todos (not under a type filter, per spec §3.2 partition)
    if (activeChip === 'todos') {
      const groups = groupScheduledBySlot(STORE.scheduled, now);
      if (groups.length) {
        const inner = groups.map(g => `<div class="slot"><h4>${escapeHtml(g.label)}</h4>${g.orders.map(({id,order}) => orderCard(id, order, now)).join('')}</div>`).join('');
        body += sectionBlock('Programados', inner, 'gold', groups.reduce((n,g)=>n+g.orders.length,0));
      }
    }
  }
  $('tab-pedidos').innerHTML = chipBar + (body || emptyState('Sin pedidos activos'));
  bindBoardEvents();
}

function bindBoardEvents(){
  const root = $('tab-pedidos');
  root.querySelectorAll('.chip').forEach(b =>
    b.addEventListener('click', () => { activeChip = b.dataset.chip; renderBoard(); }));
  root.querySelectorAll('.sec-h').forEach(h =>
    h.addEventListener('click', () => {
      const sec = h.closest('.sec'); const label = sec?.dataset.sec;
      if (!label) return;
      if (collapsed.has(label)) collapsed.delete(label); else collapsed.add(label);
      sec.classList.toggle('collapsed');
    }));
  root.querySelectorAll('.mappin').forEach(b =>
    b.addEventListener('click', (e) => { e.stopPropagation(); window.__showTab('mapa'); window.__focusOrderOnMap?.(b.dataset.order); }));
  root.querySelectorAll('.card').forEach(c =>
    c.addEventListener('click', () => window.__openOrderDetail?.(c.dataset.order)));
}

function loadMaps() {
  return new Promise((resolve, reject) => {
    if (window.google && window.google.maps && window.google.maps.Map) return resolve();
    // Inline the official Google Maps bootstrap loader (verbatim from xpizza-dispatch/index.html).
    (g => { var h, a, k, p = "The Google Maps JavaScript API", c = "google", l = "importLibrary", q = "__ib__", m = document, b = window; b = b[c] || (b[c] = {}); var d = b.maps || (b.maps = {}), r = new Set, e = new URLSearchParams, u = () => h || (h = new Promise(async (f, n) => { await (a = m.createElement("script")); e.set("libraries", [...r] + ""); for (k in g) e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]); e.set("callback", c + ".maps." + q); a.src = `https://maps.${c}apis.com/maps/api/js?` + e; d[q] = f; a.onerror = () => h = n(Error(p + " could not load.")); a.nonce = m.querySelector("script[nonce]")?.nonce || ""; m.head.append(a); })); d[l] ? console.warn(p + " only loads once. Ignoring:", g) : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)); })({ key: mapsApiKey, v: "weekly" });
    google.maps.importLibrary("maps").then(() => resolve()).catch(reject);
  });
}

function showMapMsg(text){ const el = $('map-msg'); if (!el) return; el.textContent = text; el.classList.toggle('hidden', !text); }

window.__onMapaShown = async () => {
  if (mapFailed) return;
  if (!mapReady) {
    try {
      await loadMaps();
      map = new google.maps.Map($('map'), {
        center: { lat:15.5063, lng:-88.0250 }, zoom:13, styles: mapStyles(),
        disableDefaultUI:true, gestureHandling:'greedy', backgroundColor:'#131826',
      });
      mapReady = true;
      if (window.ResizeObserver) new ResizeObserver(() => { if (map) google.maps.event.trigger(map, 'resize'); }).observe(document.querySelector('.map-wrap'));
    } catch (e) {
      mapFailed = true; showMapMsg('Mapa no disponible — el tablero sigue en vivo.'); return;
    }
  } else {
    google.maps.event.trigger(map, 'resize');
  }
  renderDrivers();
};

// Restyle the live map when the theme toggles (registered AFTER Task 2's toggle handler, which flips
// data-theme first, so this reads the new theme).
$('theme-toggle').addEventListener('click', () => { if (mapReady && map) map.setOptions({ styles: mapStyles() }); });

function orderForDriver(uid){
  for (const id of Object.keys(STORE.orders)) {
    if (assignedDriverId(id, STORE.tasks) === uid) return id;
  }
  return null;
}

window.__driversUpdated = () => {
  if (mapReady) renderDrivers();
  const dt = $('tab-drivers'); if (dt && !dt.classList.contains('hidden')) renderDriversTab();   // r2-C live roster
};

// Marker fill by status/staleness — brand tokens (mirrors the desktop dispatch's color tiers).
function driverMarkerColor(status, stale){
  if (stale) return '#EE9F3C';                                       // amber — reachable, just idle
  switch (status) {
    case 'available': case 'at_restaurant': return '#46A24A';        // green (--listo)
    case 'en_route_delivery': return '#6E77CC';                      // indigo (--camino)
    case 'returning': case 'assigned': return '#EE9F3C';             // amber
    default: return '#6f7681';                                       // grey (--done)
  }
}

function renderDrivers(){
  if (!mapReady) return;
  const strokeCol = currentTheme() === 'dark' ? '#131826' : '#ffffff';
  const seen = new Set();
  for (const [uid, d] of Object.entries(STORE.drivers)) {
    // Only plot ON-SHIFT drivers with real coords — an off-shift driver's last stale position is not
    // a live pin (was: every driver with lat/lng → bare red pins, incl. off-shift/stale).
    if (!d || d.status === XPD.DRIVER_STATUS.OFF_SHIFT) continue;
    if (typeof d.lat !== 'number' || typeof d.lng !== 'number') continue;
    seen.add(uid);
    const stale = XPD.isStalePing(d.last_ping);
    const pos = { lat:d.lat, lng:d.lng };
    const icon = { path: google.maps.SymbolPath.CIRCLE, scale: 13, fillColor: driverMarkerColor(d.status, stale),
                   fillOpacity: 1, strokeColor: strokeCol, strokeWeight: 2.5 };
    const label = { text: (d.name || '?').charAt(0).toUpperCase(), color:'#fff', fontFamily:'Hanken Grotesk', fontSize:'11px', fontWeight:'700' };
    if (driverMarkers[uid]) { driverMarkers[uid].setPosition(pos); driverMarkers[uid].setIcon(icon); driverMarkers[uid].setLabel(label); }
    else {
      const mk = new google.maps.Marker({ map, position:pos, icon, label, title: d.name || 'Repartidor', zIndex:1000 });
      mk.addListener('click', () => openDriverInfo(uid));   // styled info window (name · status · order#)
      driverMarkers[uid] = mk;
    }
  }
  for (const uid of Object.keys(driverMarkers)) if (!seen.has(uid)) { driverMarkers[uid].setMap(null); delete driverMarkers[uid]; }
}

// Driver info window (rendered in Google's light bubble → fixed dark text): name · status · current order#.
function openDriverInfo(uid){
  const d = STORE.drivers[uid], mk = driverMarkers[uid];
  if (!d || !mk) return;
  if (!driverInfoWindow) driverInfoWindow = new google.maps.InfoWindow();
  const oid = orderForDriver(uid);
  const ordLabel = oid ? displayLabel(oid, STORE.orders[oid]) : null;
  const statusEs = DRIVER_STATUS_ES[d.status] || d.status || '';
  driverInfoWindow.setContent(`<div style="font-family:'Hanken Grotesk',system-ui,sans-serif;padding:1px 3px;min-width:118px">
    <div style="font-weight:700;font-size:14px;color:#1b1e24">${escapeHtml(d.name || 'Repartidor')}</div>
    <div style="font-size:12px;color:#6b727c;margin-top:1px">${escapeHtml(statusEs)}${ordLabel ? ` · ${escapeHtml(ordLabel)}` : ''}</div>
  </div>`);
  driverInfoWindow.open(map, mk);
}

// Tap a roster row → Mapa focused on that driver (reuse the map + info window).
window.__focusDriverOnMap = async (uid) => {
  await window.__onMapaShown();
  if (!mapReady) return;
  clearFocus();
  const d = STORE.drivers[uid];
  if (d && typeof d.lat === 'number' && typeof d.lng === 'number') {
    map.panTo({ lat:d.lat, lng:d.lng }); map.setZoom(15);
    openDriverInfo(uid);   // no-op if off-shift (no marker); the pan still frames their last position
  }
};

// ─────────────────────────────────────────────────────────────────────────────
// Drivers tab (r2-C) — read-only roster from STORE.drivers, grouped En turno / Fuera de turno.
// ─────────────────────────────────────────────────────────────────────────────
function driverRowHtml(uid, d){
  const stale = XPD.isStalePing(d.last_ping);
  const col = driverMarkerColor(d.status, stale);
  const statusEs = DRIVER_STATUS_ES[d.status] || d.status || '—';
  const oid = orderForDriver(uid);
  const ordLabel = oid ? displayLabel(oid, STORE.orders[oid]) : null;
  const live = !stale;
  return `<div class="drow" data-drv="${escapeHtml(uid)}">
    <span class="dstat" style="background:${col}"></span>
    <div class="dinfo"><div class="dnm">${escapeHtml(d.name || 'Repartidor')}</div><div class="dsub">${escapeHtml(statusEs)}</div></div>
    <div class="dright">
      <span class="gpspill ${live?'vivo':'inact'}">${live?'GPS vivo':'inactivo'}</span>
      ${ordLabel ? `<span class="dord">${escapeHtml(ordLabel)}</span>` : '<span class="dord dash">sin pedido</span>'}
    </div>
  </div>`;
}
function rosterSection(title, entries, stripeVar){
  const rows = entries.map(([uid, d]) => driverRowHtml(uid, d)).join('') || `<div class="empty">—</div>`;
  return `<div class="rsec"><div class="sec-h">
      <span class="stripe" style="background:var(${stripeVar})"></span>
      <span class="name">${escapeHtml(title)}</span>
      <span class="cnt">${entries.length}</span>
    </div><div class="sec-body">${rows}</div></div>`;
}
function renderDriversTab(){
  const all = Object.entries(STORE.drivers).filter(([, d]) => d && (d.name || typeof d.lat === 'number' || d.status));
  const onShift = all.filter(([, d]) => d.status !== XPD.DRIVER_STATUS.OFF_SHIFT);
  const offShift = all.filter(([, d]) => d.status === XPD.DRIVER_STATUS.OFF_SHIFT);
  const byLiveName = ([, a], [, b]) =>
    (XPD.isStalePing(a.last_ping) ? 1 : 0) - (XPD.isStalePing(b.last_ping) ? 1 : 0)
    || String(a.name || '').localeCompare(String(b.name || ''));
  onShift.sort(byLiveName); offShift.sort(byLiveName);
  const html = (onShift.length || offShift.length)
    ? `<div class="roster">${rosterSection('En turno', onShift, '--listo')}${rosterSection('Fuera de turno', offShift, '--done')}</div>`
    : `<div class="empty" style="padding:44px 16px">Sin repartidores</div>`;
  $('tab-drivers').innerHTML = html;
  $('tab-drivers').querySelectorAll('.drow').forEach(r =>
    r.addEventListener('click', () => { window.__showTab('mapa'); window.__focusDriverOnMap?.(r.dataset.drv); }));
}

function clearFocus(){
  focusLayer.markers.forEach(m => m.setMap(null)); focusLayer.markers = [];
  if (focusLayer.line) { focusLayer.line.setMap(null); focusLayer.line = null; }
  if (focusLayer.route) { focusLayer.route.setMap(null); focusLayer.route = null; }
  $('ver-todos')?.classList.add('hidden');
}

// Per-order focus (Ver en mapa): destination pin + assigned-driver pin + a route line driver→dest.
// Pickup focuses the restaurant origin (no delivery destination).
window.__focusOrderOnMap = async (orderId) => {
  await window.__onMapaShown();
  if (!mapReady) return;
  clearFocus();
  const dt = STORE.tasks[`${orderId}_delivery`];
  const order = STORE.orders[orderId];
  $('ver-todos')?.classList.remove('hidden');
  if (order?.order_type === 'pickup') {   // focus origin/restaurant
    const hub = HUBS[order.restaurant_id] || HUBS.x_pizza;
    map.panTo(hub); map.setZoom(15);
    focusLayer.markers.push(new google.maps.Marker({ map, position:hub, label:'R' }));
    return;
  }
  const finite = (v) => typeof v === 'number' && isFinite(v);
  const dest = finite(dt?.destination_lat) ? { lat:dt.destination_lat, lng:dt.destination_lng }
             : (finite(order?.lat) ? { lat:order.lat, lng:order.lng } : null);
  const drvId = dt?.assigned_driver_id; const drv = drvId && STORE.drivers[drvId];
  if (dest) { focusLayer.markers.push(new google.maps.Marker({ map, position:dest, label:'D' })); map.panTo(dest); map.setZoom(15); }
  if (drv && finite(drv.lat)) focusLayer.markers.push(new google.maps.Marker({ map, position:{lat:drv.lat,lng:drv.lng}, opacity: XPD.isStalePing(drv.last_ping)?0.5:1 }));
  // Real road route (was a literal straight segment): DirectionsService → DirectionsRenderer, drawn only
  // when there's a live driver + destination; keep our own dest/driver pins (suppressMarkers). Auxiliary:
  // a Directions failure degrades to no line, never breaks the map (the pins still convey it).
  if (dest && drv && finite(drv.lat)) {
    if (!dirService) dirService = new google.maps.DirectionsService();
    const renderer = new google.maps.DirectionsRenderer({
      map, suppressMarkers:true, preserveViewport:true,
      polylineOptions: { strokeColor:'#6E77CC', strokeOpacity:0.9, strokeWeight:5 },
    });
    focusLayer.route = renderer;
    dirService.route({
      origin: { lat:drv.lat, lng:drv.lng }, destination: dest, travelMode: google.maps.TravelMode.DRIVING,
    }, (res, status) => {
      if (focusLayer.route !== renderer) { renderer.setMap(null); return; }   // a newer focus/clear superseded us
      if (status === 'OK' && res) renderer.setDirections(res);
      else { renderer.setMap(null); focusLayer.route = null; }                // degrade: no line
    });
  }
};

$('ver-todos').addEventListener('click', () => { clearFocus(); if (mapReady) { map.setZoom(13); renderDrivers(); } });

// ─────────────────────────────────────────────────────────────────────────────
// Assign / reassign — the ONE mutation. Order detail → driver pick → confirm → write.
// The write mirrors the DESKTOP dispatch EXACTLY (xpizza-dispatch/index.html assignOrder):
//   • reassign of an ALREADY-assigned order → SDK reassignOrder (id, drv, fromDriver)
//     (CAS against the driver captured at pick-open + old-driver current_task_id/status cleanup)
//   • fresh assign of an UNASSIGNED order   → SDK assignOrderToDriver (id, drv)
// Both are the bundled, byte-identical SDK paths — we add/subtract NO assignment rules. Using only
// assignOrderToDriver (as the plan sketch did) would fail every real reassign: its CAS commits only
// when the delivery task is currently unassigned, so an already-assigned order returns
// {ok:false, reason:'already_assigned'} and never moves + never releases the old driver.
// ─────────────────────────────────────────────────────────────────────────────
let pickerFromDriver = null;   // driver frozen at pick-open — reassignOrder's CAS anchor (stale-view guard)
let pickerIsReassign = false;

function openSheet(html){ $('sheet-body').innerHTML = html; $('scrim').classList.add('on'); $('sheet').classList.add('on'); }
function closeSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); }
$('scrim').addEventListener('click', closeSheet);

let _toastT;
function toast(msg, kind){
  const el = $('toast'); el.textContent = msg; el.className = kind === 'error' ? 'on error' : 'on';
  clearTimeout(_toastT); _toastT = setTimeout(() => el.classList.remove('on'), 2600);
}

// Failure copy — mirrors the desktop's assignFailMsg.
function assignFailMsg(reason){
  switch (reason) {
    case 'already_assigned':
    case 'pickup_taken': return 'Ya fue asignada a otro repartidor';
    case 'claim_stale': return 'La asignación cambió — actualizá e intentá de nuevo';
    case 'write_failed': return 'No se pudo asignar (error de red) — reintentá';
    default: return 'No se pudo asignar';
  }
}

// Sheet icons (calendar for scheduled, storefront for pickup) — stroke=currentColor to sit on the av bg.
const IC_CAL='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>';
const IC_STORE='<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.7V20h16V9.7M3.2 6.6 4.4 4h15.2l1.2 2.6a2.3 2.3 0 0 1-4.4 1 2.3 2.3 0 0 1-4.4 0 2.3 2.3 0 0 1-4.4 0 2.3 2.3 0 0 1-4.4 0Z"/></svg>';

const brandCls = (order) => order && order.restaurant_id === 'la_musa' ? 'lm' : 'xp';
const brandName = (order) => order && order.restaurant_id === 'la_musa' ? 'La Musa' : 'X. Pizza';
const slotLabelSafe = (ms) => { try { return slotLabel(Number(ms), Date.now()); } catch { return ''; } };

// A small real Google Static Maps thumbnail focused on the order pin (the lightest faithful real map —
// one <img>, no live map instance in a transient sheet). Degrades to nothing if it fails to load.
function miniMapHtml(focus){
  if (!focus) return '';
  const c = `${focus.lat},${focus.lng}`;
  const url = `https://maps.googleapis.com/maps/api/staticmap?center=${c}&zoom=15&size=340x150&scale=2`
    + `&markers=color:0x6E77CC%7C${c}&key=${encodeURIComponent(mapsApiKey)}`;
  return `<div class="mini-map"><img src="${url}" alt="Ubicación del pedido" onerror="this.closest('.mini-map').style.display='none'"></div>`;
}
function orderFocus(orderId, order){
  const finite = (v) => typeof v === 'number' && isFinite(v);
  if (order.order_type === 'pickup') return HUBS[order.restaurant_id] || HUBS.x_pizza;
  const dt = STORE.tasks[`${orderId}_delivery`];
  if (finite(dt?.destination_lat)) return { lat:dt.destination_lat, lng:dt.destination_lng };
  if (finite(order.lat)) return { lat:order.lat, lng:order.lng };
  return null;
}

window.__openOrderDetail = (orderId) => {
  const order = STORE.orders[orderId] || STORE.scheduled[orderId]; if (!order) return;
  const isScheduled = order.status === 'scheduled' || (!!STORE.scheduled[orderId] && !STORE.orders[orderId]);
  const drvId = assignedDriverId(orderId, STORE.tasks);
  const actionable = canReassign(order);   // delivery + live only (pickup/scheduled/completed → no action)
  const section = sectionForOrder(order);
  const estado = isScheduled ? 'Programado' : (SECTION_LABELS[section] || '—');
  const slot = isScheduled && Number(order.scheduled_for) ? slotLabelSafe(order.scheduled_for) : '';
  const direccion = order.address_detected || order.address_details || '—';
  const tiempo = formatAging(agingSeconds(agingBaselineMs(order), Date.now()));
  const totalStr = Number(order.total || 0).toFixed(2);

  // status-row — 4 branches (scheduled / pickup / assigned-driver / unassigned), mockup markup.
  let statusRow;
  if (isScheduled) {
    statusRow = `<div class="status-row"><span class="av" style="background:var(--prog)">${IC_CAL}</span>
      <div style="flex:1"><div style="font-weight:700;font-size:14px">Programado${slot?' · '+escapeHtml(slot):''}</div><div style="font-size:11.5px;color:var(--mut)">Se activa automáticamente a la hora</div></div></div>`;
  } else if (order.order_type === 'pickup') {
    const ready = section === 'listos';
    statusRow = `<div class="status-row"><span class="av" style="background:${ready?'var(--listo)':'var(--dim)'};color:#fff">${IC_STORE}</span>
      <div style="flex:1"><div style="font-weight:700;font-size:14px">${ready?'Listo para recoger':'Recoge el cliente'}</div><div style="font-size:11.5px;color:var(--mut)">Pedido de mostrador · sin repartidor</div></div></div>`;
  } else if (drvId) {
    const dObj = STORE.drivers[drvId] || {}; const stale = XPD.isStalePing(dObj.last_ping);
    const statusEs = DRIVER_STATUS_ES[dObj.status] || dObj.status || '';
    statusRow = `<div class="status-row"><span class="av" style="background:${stale?'var(--inact)':'var(--vivo)'}">${escapeHtml((dObj.name||'?').charAt(0).toUpperCase())}</span>
      <div style="flex:1"><div style="font-weight:700;font-size:14px">${escapeHtml(dObj.name||'Repartidor')}</div><div style="font-size:11.5px;color:var(--mut)">GPS ${stale?'inactivo':'vivo'} · ${escapeHtml(statusEs)}</div></div>
      ${stale?'<span class="tagcur">Sin señal</span>':''}</div>`;
  } else {
    statusRow = `<div class="status-row"><span class="av" style="background:var(--line);color:var(--mut)">?</span>
      <div style="flex:1"><div style="font-weight:700;font-size:14px">Sin asignar</div><div style="font-size:11.5px;color:var(--mut)">Ningún repartidor asignado</div></div></div>`;
  }

  const typeLabel = order.order_type === 'pickup' ? 'Recoge el cliente' : 'Delivery';
  openSheet(`
    <div style="display:flex;align-items:center;gap:9px"><div class="sh-title">${escapeHtml(order.customer_name||'Cliente')}</div><span class="brand ${brandCls(order)}">${brandCls(order)==='xp'?'X.PIZZA':'LA MUSA'}</span></div>
    <div class="sh-sub">Pedido ${escapeHtml(displayLabel(orderId, order))} · ${escapeHtml(brandName(order))} · ${escapeHtml(typeLabel)}</div>
    <div class="items-box"><div class="detail-items">${renderOrderItems(order)}</div></div>
    <div class="kv"><span class="k">Estado</span><span class="v">${escapeHtml(estado)}</span></div>
    ${isScheduled && slot ? `<div class="kv"><span class="k">Horario</span><span class="v">${escapeHtml(slot)}</span></div>` : ''}
    <div class="kv"><span class="k">Dirección</span><span class="v">${escapeHtml(direccion)}</span></div>
    ${isScheduled ? '' : `<div class="kv"><span class="k">Tiempo</span><span class="v">${escapeHtml(tiempo)}</span></div>`}
    <div class="kv"><span class="k">Total</span><span class="v">L ${escapeHtml(totalStr)}</span></div>
    ${statusRow}
    ${actionable
      ? `<button id="do-reassign" class="btn ${drvId?'btn-warn':'btn-primary'}">${drvId?'Reasignar':'Asignar'} repartidor</button>
         <button id="detail-close" class="btn btn-ghost">Cerrar</button>`
      : `<button id="detail-close" class="btn btn-ghost">Cerrar</button>`}
  `);
  $('detail-close').addEventListener('click', closeSheet);
  if (actionable) $('do-reassign').addEventListener('click', () => openDriverPick(orderId));
};

function openDriverPick(orderId){
  const order = STORE.orders[orderId] || STORE.scheduled[orderId]; if (!order) return;
  // FROZEN write setup (unchanged): freeze the from-driver + reassign-ness AS SHOWN at pick-open — the
  // reassignOrder CAS anchors on pickerFromDriver so a moved order aborts instead of clobbering.
  pickerFromDriver = assignedDriverId(orderId, STORE.tasks);
  pickerIsReassign = !!pickerFromDriver;
  const hub = HUBS[order.restaurant_id] || HUBS.x_pizza;
  const list = driverPickList({ order, orderId, drivers:STORE.drivers, tasks:STORE.tasks, hub, now:Date.now(), isStale:XPD.isStalePing });
  const rows = list.length ? list.map(d => {
    const col = d.live ? 'var(--vivo)' : 'var(--inact)';
    const dist = Number.isFinite(d.distanceM) ? Math.round(d.distanceM) + ' m' : '—';
    const statusEs = DRIVER_STATUS_ES[STORE.drivers[d.id]?.status] || d.status || '';
    const tag = d.isCurrent ? '<span class="tagcur">actual</span>' : '';
    return `<div class="dpick${d.isCurrent?' current':''}" data-drv="${escapeHtml(d.id)}">
      <span class="av" style="background:${col}">${escapeHtml((d.name||'?').charAt(0).toUpperCase())}</span>
      <div class="info">
        <div class="dn">${escapeHtml(d.name)} ${tag}</div>
        <div class="ds"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle;background:${col}"></span> GPS ${d.live?'vivo':'inactivo'} · ${escapeHtml(statusEs)} · ${d.load} pedido${d.load===1?'':'s'}</div>
      </div>
      <div class="meta"><div class="dist">${escapeHtml(dist)}</div></div>
    </div>`;
  }).join('') : `<div class="empty" style="padding:20px 2px">No hay repartidores en turno</div>`;
  const addr = order.address_detected || order.address_details || '—';
  openSheet(`
    <div class="sh-title">${pickerIsReassign?'Reasignar':'Asignar'} ${escapeHtml(displayLabel(orderId, order))}</div>
    <div class="sh-sub">${escapeHtml(order.customer_name||'Cliente')} · ${escapeHtml(addr)} · ${escapeHtml(brandName(order))}</div>
    ${miniMapHtml(orderFocus(orderId, order))}
    <div class="pick-label">Repartidores cercanos</div>
    ${rows}
    <button id="pick-cancel" class="btn btn-ghost">Cancelar</button>
  `);
  $('pick-cancel').addEventListener('click', closeSheet);
  document.querySelectorAll('#sheet .dpick:not(.current)').forEach(b =>
    b.addEventListener('click', () => confirmReassign(orderId, b.dataset.drv)));
}

function confirmReassign(orderId, driverId){
  const order = STORE.orders[orderId] || STORE.scheduled[orderId] || {};
  const fromD = pickerFromDriver ? (STORE.drivers[pickerFromDriver] || {}) : null;
  const toD = STORE.drivers[driverId] || {};
  const hub = HUBS[order.restaurant_id] || HUBS.x_pizza;
  const toRow = driverPickList({ order, orderId, drivers:STORE.drivers, tasks:STORE.tasks, hub, now:Date.now(), isStale:XPD.isStalePing }).find(r => r.id === driverId);
  const toDist = toRow && Number.isFinite(toRow.distanceM) ? Math.round(toRow.distanceM) + ' m' : '';
  const av = (d, live) => `<div class="cf-av" style="background:${live?'var(--vivo)':'var(--inact)'}">${escapeHtml((d.name||'?').charAt(0).toUpperCase())}</div>`;
  const fromNode = fromD
    ? `<div class="cf-node">${av(fromD, !XPD.isStalePing(fromD.last_ping))}<div class="cf-nm">${escapeHtml((fromD.name||'—').split(' ')[0])}</div><div style="font-size:10px;color:var(--inact);font-weight:700">${XPD.isStalePing(fromD.last_ping)?'sin señal':''}</div></div><div class="cf-arrow">→</div>`
    : '';
  const toNode = `<div class="cf-node">${av(toD, !XPD.isStalePing(toD.last_ping))}<div class="cf-nm">${escapeHtml((toD.name||'Repartidor').split(' ')[0])}</div><div style="font-size:10px;color:var(--vivo);font-weight:700">${escapeHtml(toDist)}</div></div>`;
  openSheet(`
    <div class="sh-title">${pickerIsReassign?'¿Reasignar':'¿Asignar'} ${escapeHtml(displayLabel(orderId, order))}?</div>
    <div class="sh-sub">${escapeHtml(order.customer_name||'Cliente')} · ${escapeHtml(brandName(order))}</div>
    <div class="confirm-flow">${fromNode}${toNode}</div>
    <div class="cf-note">Se aplican las mismas reglas que en el dispatch — las tareas de recolección + entrega se mueven juntas.</div>
    <button id="confirm-yes" class="btn btn-primary">Confirmar</button>
    <button id="confirm-no" class="btn btn-ghost">Cancelar</button>
  `);
  $('confirm-no').addEventListener('click', closeSheet);
  $('confirm-yes').addEventListener('click', async () => {
    const btn = $('confirm-yes'); btn.disabled = true;
    try {
      // THE ONE (RE)ASSIGNMENT WRITE — FROZEN, byte-identical to the gated version (desktop path per case).
      const res = pickerIsReassign
        ? await XPD.reassignOrder(orderId, driverId, pickerFromDriver)
        : await XPD.assignOrderToDriver(orderId, driverId);
      if (res && res.ok) { toast(pickerIsReassign ? 'Reasignado' : 'Asignado'); closeSheet(); }
      else { toast(assignFailMsg(res?.reason), 'error'); btn.disabled = false; }
    } catch (e) { toast('Error de red — reintentá', 'error'); btn.disabled = false; }
  });
}
</script>
</body>
</html>
