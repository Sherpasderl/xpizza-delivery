<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- FIRST-PAINT root background: on an iOS installed PWA the screen is taller than the web viewport
     and iOS paints the out-of-bounds bottom strip itself, sampling the DOCUMENT-ROOT background at
     first paint — BEFORE the main <style> applies. This tiny style must come first so <html> already
     carries the ground the instant iOS samples it (else the strip renders grey). -->
<style>html{background:#F6F4FB}@media(prefers-color-scheme:dark){html{background:#131120}}</style>
<title>Dispatch · X. Pizza + La Musa</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#131120" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F6F4FB" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dispatch">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* ── Token layer ────────────────────────────────────────────────────────────
     Light is the base. Dark redefines ONLY tokens, guarded so an explicit light
     choice beats a dark OS. Component CSS below reads tokens and never raw hex,
     with one sanctioned exception: Google Maps markers/styles cannot read CSS
     custom properties, so driverMarkerColor() + DARK_MAP_STYLE keep their own
     copy. Change a status colour here and change it there too.
     Semantics: mint = calm · sky = moving · lilac = watch · rose = act now. */
  :root{
    --ground:#F6F4FB; --card:#FFFFFF; --sunken:#EFEBF7;
    --ink:#191627; --ink2:#5E5A75; --ink3:#8E89A6;
    --hair:rgba(40,25,80,.10); --ring:rgba(40,25,80,.07);
    --violet:#8D4DD5; --violet-solid:#9256D7; --violet-wash:#F1E8FC;
    --rose-bg:#FFE3EE; --rose-ink:#C8205E;
    --lilac-bg:#EEE6FD; --lilac-ink:#7E45E1;
    --sky-bg:#E2EFFE; --sky-ink:#1F6BC1;
    --mint-bg:#DFF6EC; --mint-ink:#147B5C;
    --xp:#D13B6D; --lm:#9558CA;
    --shadow-s:0 1px 2px rgba(40,25,80,.07);
    --shadow-m:0 10px 22px -12px rgba(40,25,80,.34), 0 1px 2px rgba(40,25,80,.06);
    --shadow-l:0 -14px 44px rgba(40,25,80,.18);
    --lift-accent:0 10px 22px -12px rgba(146,86,215,.55);
    --lift-open:0 22px 44px -18px rgba(40,25,80,.42);
    --bar:rgba(255,255,255,.82);
    --scrim:rgba(30,20,55,.42);
    --ease:cubic-bezier(.32,.72,0,1);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#131120; --card:#1C1930; --sunken:#181528;
      --ink:#F1EFFA; --ink2:#A7A1C2; --ink3:#7A748F;
      --hair:rgba(255,255,255,.11); --ring:rgba(255,255,255,.08);
      --violet:#A565EE; --violet-solid:#9256D7; --violet-wash:#241A3A;
      --rose-bg:#2E1726; --rose-ink:#F58FB4;
      --lilac-bg:#221A38; --lilac-ink:#B79BF5;
      --sky-bg:#152238; --sky-ink:#79B4F2;
      --mint-bg:#11281F; --mint-ink:#5FD3A8;
      --xp:#F07CA5; --lm:#B79BF5;
      --shadow-s:0 1px 2px rgba(0,0,0,.5);
      --shadow-m:0 12px 26px -14px rgba(0,0,0,.9), 0 1px 2px rgba(0,0,0,.4);
      --shadow-l:0 -16px 48px rgba(0,0,0,.6);
      --lift-accent:0 10px 22px -12px rgba(0,0,0,.72);
      --lift-open:0 20px 40px -18px rgba(0,0,0,.8);
      --bar:rgba(34,30,52,.82);
      --scrim:rgba(0,0,0,.58);
    }
  }
  :root[data-theme="dark"]{
    --ground:#131120; --card:#1C1930; --sunken:#181528;
    --ink:#F1EFFA; --ink2:#A7A1C2; --ink3:#7A748F;
    --hair:rgba(255,255,255,.11); --ring:rgba(255,255,255,.08);
    --violet:#A565EE; --violet-solid:#9256D7; --violet-wash:#241A3A;
    --rose-bg:#2E1726; --rose-ink:#F58FB4;
    --lilac-bg:#221A38; --lilac-ink:#B79BF5;
    --sky-bg:#152238; --sky-ink:#79B4F2;
    --mint-bg:#11281F; --mint-ink:#5FD3A8;
    --xp:#F07CA5; --lm:#B79BF5;
    --shadow-s:0 1px 2px rgba(0,0,0,.5);
    --shadow-m:0 12px 26px -14px rgba(0,0,0,.9), 0 1px 2px rgba(0,0,0,.4);
    --shadow-l:0 -16px 48px rgba(0,0,0,.6);
    --lift-accent:0 10px 22px -12px rgba(0,0,0,.72);
    --lift-open:0 20px 40px -18px rgba(0,0,0,.8);
    --bar:rgba(34,30,52,.82);
    --scrim:rgba(0,0,0,.58);
  }

  /* Radius scale — four roles, nothing else:
     22 surface (pass, sheet, app mark) · 18 group (panel, warn, toast, map-msg)
     14 control (button, fact, input, segmented) · 999 pill (chip, tab bar, tab, avatar)
     The 10px inside .seg button is that control's geometric inset (14 − 4 padding), not a fifth value. */
  html{ background:var(--ground); color-scheme:light dark; }
  :root[data-theme="light"]{ color-scheme:light; }
  :root[data-theme="dark"]{ color-scheme:dark; }
  /* Kill double-tap-to-zoom (and the legacy 300ms tap delay) on an app-like surface, WITHOUT
     touching pinch-zoom: `manipulation` permits panning and pinch, and only drops the
     non-standard double-tap gesture. Deliberately NOT user-scalable=no in the viewport meta —
     that would disable pinch too, and pinch is the presbyopic owner's only text-size remedy on an
     installed PWA (WCAG 1.4.4). */
  html,body{ height:100%; margin:0; touch-action:manipulation; }
  button,a,[role="tab"],[role="dialog"]{ touch-action:manipulation; }
  body{
    background:var(--ground); color:var(--ink); overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  *{ box-sizing:border-box }
  button{ font:inherit; color:inherit; -webkit-tap-highlight-color:transparent }
  :focus-visible{ outline:3px solid var(--violet); outline-offset:2px; border-radius:10px }
  ::selection{ background:var(--violet-wash); color:var(--ink) }
  .rd{ font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif }
  .num{ font-variant-numeric:tabular-nums }
  .sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0 }
  .hidden{ display:none !important }
  @media (prefers-reduced-motion: reduce){ *{ transition-duration:.001ms !important; animation-duration:.001ms !important } }

  /* iOS standalone PWA miscomputes viewport height at first paint (a grey band below the shell that
     only fills after the first scroll). __fitShell pins the height in px from visualViewport; this
     100dvh is only the pre-JS fallback. */
  #screen-main{ position:fixed; top:0; left:0; right:0; height:100dvh; display:flex; flex-direction:column;
    overflow:hidden; background:var(--ground); }

  /* ── header ── */
  .hdr{ flex:0 0 auto; padding:calc(env(safe-area-inset-top) + 10px) 20px 8px }
  .hdr-top{ display:flex; align-items:center; gap:10px }
  .ttl{ font-size:32px; font-weight:700; letter-spacing:-.9px; line-height:1 }
  .sub{ font-size:14.5px; color:var(--ink2); margin-top:6px; letter-spacing:-.15px }
  .sub b{ color:var(--rose-ink); font-weight:600 }
  .ibtn{ width:38px; height:38px; border-radius:50%; border:none; background:var(--card); box-shadow:inset 0 0 0 1px var(--ring);
    display:grid; place-items:center; cursor:pointer; flex:0 0 auto; color:var(--ink2) }
  .live{ display:inline-flex; align-items:center; gap:7px; padding:7px 12px 7px 9px; border-radius:999px; border:none;
    background:var(--card); box-shadow:inset 0 0 0 1px var(--ring); font-size:13px; font-weight:600; color:var(--ink2);
    cursor:pointer; white-space:nowrap; margin-left:auto }
  .live i{ width:7px; height:7px; border-radius:50%; background:var(--mint-ink); flex:0 0 auto }
  .live.off i{ background:var(--rose-ink) }
  .live.wait i{ background:var(--lilac-ink) }

  /* ── chips ── */
  .chips{ flex:0 0 auto; display:flex; gap:8px; overflow-x:auto; padding:8px 20px 12px; scrollbar-width:none }
  .chips::-webkit-scrollbar{ display:none }
  .chip{ flex:0 0 auto; height:36px; padding:0 15px; border-radius:999px; border:none; background:var(--card);
    box-shadow:inset 0 0 0 1px var(--ring); font-size:14.5px; font-weight:600; letter-spacing:-.2px; color:var(--ink2);
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    transition:background .18s var(--ease), color .18s var(--ease) }
  .chip .ct{ font-size:13px; font-weight:700; color:var(--ink3) }
  .chip[aria-pressed="true"]{ background:var(--ink); color:var(--ground) }
  .chip[aria-pressed="true"] .ct{ color:var(--ground); opacity:.7 }
  .chip.alert .ct{ color:var(--rose-ink) }
  .chip.alert[aria-pressed="true"] .ct{ color:var(--ground) }

  /* ── scroll body ── */
  main{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 14px 150px }
  .sec{ padding:12px 8px; font-size:12px; font-weight:700; letter-spacing:1.1px; text-transform:uppercase;
    color:var(--ink3); display:flex; align-items:center; gap:8px; width:100%; background:none; border:none;
    text-align:left; cursor:default }
  button.sec{ cursor:pointer }
  .sec .n{ margin-left:auto; letter-spacing:0 }
  .sec .chev{ transition:transform .22s var(--ease) }
  .sec[aria-expanded="true"] .chev{ transform:rotate(90deg) }
  .slot-h{ margin:14px 8px 8px; font-size:13px; font-weight:700; color:var(--lilac-ink); letter-spacing:-.1px }

  /* ── wallet-style pass deck ── */
  .deck{ display:flex; flex-direction:column; padding-bottom:4px }
  .pass{ position:relative; width:100%; border-radius:22px; background:var(--card);
    box-shadow:var(--shadow-m), inset 0 0 0 1px var(--ring); overflow:hidden;
    transition:margin-top .44s var(--ease), box-shadow .3s var(--ease) }
  .pass.lv-act{ background:var(--rose-bg) }
  .pass.lv-watch{ background:var(--lilac-bg) }
  /* Completed passes must be OPAQUE. They were transparent while they had no body and therefore
     no overlap; now they stack like every other pass, and a transparent card lets the one beneath
     read straight through it. Recessed surface keeps them quiet without making them see-through. */
  .pass.lv-done{ background:var(--sunken); box-shadow:var(--shadow-m), inset 0 0 0 1px var(--ring) }
  .pass.open{ box-shadow:var(--shadow-m), var(--lift-open), inset 0 0 0 1px var(--ring) }
  .peek{ display:flex; align-items:flex-start; gap:14px; width:100%; height:80px; padding:15px 16px 0;
    background:transparent; border:none; text-align:left; cursor:pointer; transition:transform .16s var(--ease) }
  .peek:active{ transform:scale(.988) }
  .peek .t{ flex:0 0 auto; width:52px }
  .peek .t b{ display:block; font-size:33px; font-weight:700; letter-spacing:-1.8px; line-height:.88 }
  .peek .t s{ display:block; font-size:11px; font-weight:600; letter-spacing:.2px; margin-top:3px; color:var(--ink3); text-decoration:none }
  .lv-act .t b{ color:var(--rose-ink) }   .lv-act .t s{ color:var(--rose-ink); opacity:.85 }
  .lv-watch .t b{ color:var(--lilac-ink) } .lv-watch .t s{ color:var(--lilac-ink); opacity:.85 }
  .peek .m{ flex:1 1 auto; min-width:0 }
  .r1{ display:flex; align-items:center; gap:8px }
  .nm{ font-size:18px; font-weight:600; letter-spacing:-.45px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .bm{ flex:0 0 auto; width:19px; height:19px; border-radius:50%; display:grid; place-items:center;
    font-size:10.5px; font-weight:700; color:#fff }
  .onum{ margin-left:auto; flex:0 0 auto; font-size:13px; font-weight:600; color:var(--ink3) }
  .st{ display:flex; align-items:center; gap:7px; margin-top:5px; font-size:13.5px; font-weight:600; color:var(--ink2);
    letter-spacing:-.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .st i{ width:7px; height:7px; border-radius:50%; flex:0 0 auto }
  .st b{ font-weight:600 }
  .st q{ font-weight:400; color:var(--ink3); quotes:none }
  .st q::before{ content:", " }
  .peek .av{ flex:0 0 auto; width:42px; height:42px; border-radius:50%; display:grid; place-items:center;
    font-size:16px; font-weight:700; background:var(--sunken); color:var(--ink) }
  .lv-act .av, .lv-watch .av{ background:var(--card) }
  .av.empty{ background:transparent; border:2px dashed var(--ink3); color:var(--ink3) }
  .lv-act .av.empty{ border-color:var(--rose-ink); color:var(--rose-ink) }
  .lv-watch .av.empty{ border-color:var(--lilac-ink); color:var(--lilac-ink) }
  /* The assignment moment — the app's single authored animation. The empty ring fills with the
     driver's initial, then the pass migrates from Ahora into En curso under its own power (FLIP).
     Cause and effect, triggered by the user's own action. Nothing else on this surface animates
     without being asked. */
  /* View transitions. These answer a TAP, never a data update: the board re-renders on every RTDB
     event and on a 20s tick, and fading those would make the deck pulse all night. Only a user
     action sets the flag that plays them.
     Tabs cross-fade (what iOS does — a tab bar is lateral, not hierarchical). The sheet slides
     directionally because detail → picker → confirm IS a navigation stack: the direction tells you
     whether you went deeper or came back. */
  @keyframes pane-in{ from{ opacity:0 } to{ opacity:1 } }
  .pane-in{ animation:pane-in .2s var(--ease) both }
  @keyframes list-in{ from{ opacity:0 } to{ opacity:1 } }
  .list-in{ animation:list-in .22s var(--ease) both }
  @keyframes sh-push{ from{ opacity:0; transform:translateX(18px) } to{ opacity:1; transform:none } }
  @keyframes sh-pop{ from{ opacity:0; transform:translateX(-18px) } to{ opacity:1; transform:none } }
  .sh-push{ animation:sh-push .26s var(--ease) both }
  .sh-pop{ animation:sh-pop .26s var(--ease) both }
  @keyframes av-fill{ 0%{ transform:scale(.3); opacity:0 } 62%{ transform:scale(1.09); opacity:1 } 100%{ transform:none } }
  .av-fill{ animation:av-fill .5s var(--ease) both }
  .pbody{ padding:2px 16px 16px }
  .pbody .ln{ font-size:14.5px; color:var(--ink2); letter-spacing:-.15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  .pacts{ display:flex; gap:9px; margin-top:12px }
  .pact{ flex:1 1 0; height:44px; border-radius:14px; border:none; font-size:15px; font-weight:700; letter-spacing:-.25px;
    display:inline-flex; align-items:center; justify-content:center; gap:7px; cursor:pointer; text-decoration:none;
    background:var(--card); color:var(--violet); box-shadow:inset 0 0 0 1px var(--ring) }
  .pact.solid{ flex:1.35 1 0; background:var(--violet-solid); color:#fff; box-shadow:var(--lift-accent) }
  .pact.mini{ flex:0 0 48px; width:48px }

  .empty{ text-align:center; padding:46px 24px; color:var(--ink2) }
  .empty b{ display:block; font-size:19px; font-weight:600; color:var(--ink); letter-spacing:-.4px; margin-bottom:6px }
  .empty p{ margin:0; font-size:15px; line-height:1.45 }

  /* ── tab bar ── */
  .fade{ position:absolute; left:0; right:0; bottom:0; height:140px; pointer-events:none; z-index:5;
    background:linear-gradient(to top, var(--ground) 32%, transparent) }
  #tabbar{ position:absolute; left:50%; transform:translateX(-50%); bottom:calc(env(safe-area-inset-bottom) + 20px);
    z-index:10; display:flex; align-items:center; gap:5px; padding:7px; border-radius:999px; background:var(--bar);
    backdrop-filter:saturate(180%) blur(24px); -webkit-backdrop-filter:saturate(180%) blur(24px);
    box-shadow:inset 0 0 0 1px var(--ring) }
  .tab{ flex:0 0 auto; width:56px; height:46px; border:none; background:transparent; border-radius:999px;
    display:grid; place-items:center; color:var(--ink3); cursor:pointer;
    transition:color .22s var(--ease), background .22s var(--ease) }
  .tab[aria-selected="true"]{ background:var(--violet-solid); color:#fff }

  /* ── map ── */
  .map-wrap{ position:absolute; left:0; right:0; top:0; bottom:0 }
  #map{ position:absolute; inset:0; background:var(--sunken) }
  #ver-todos{ position:absolute; top:12px; right:14px; z-index:6; height:38px; padding:0 16px; border-radius:999px;
    border:none; background:var(--bar); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    color:var(--ink); font-size:14px; font-weight:600; box-shadow:var(--shadow-s), inset 0 0 0 1px var(--ring); cursor:pointer }
  .map-msg{ position:absolute; left:50%; transform:translateX(-50%); bottom:118px; z-index:6; max-width:82%;
    padding:12px 16px; border-radius:18px; background:var(--card); color:var(--ink); font-size:14px; text-align:center;
    box-shadow:var(--shadow-m) }

  /* ── sheet ── */
  #scrim{ position:absolute; inset:0; z-index:20; background:var(--scrim); opacity:0; visibility:hidden; border:none;
    width:100%; padding:0; transition:opacity .3s var(--ease), visibility .3s var(--ease) }
  #scrim.on{ opacity:1; visibility:visible }
  #sheet{ position:absolute; left:0; right:0; bottom:0; z-index:30; max-height:92%; display:flex; flex-direction:column;
    background:var(--ground); border-radius:22px 22px 0 0; box-shadow:var(--shadow-l);
    transform:translateY(101%); transition:transform .38s var(--ease) }
  #sheet.on{ transform:none }
  .grab{ flex:0 0 auto; width:38px; height:5px; border-radius:3px; background:var(--hair); margin:9px auto 2px }
  .sh{ flex:1 1 auto; overflow-y:auto; padding:10px 18px calc(env(safe-area-inset-bottom) + 26px) }
  .sh-nav{ display:flex; align-items:center; gap:4px; margin:0 0 6px -10px }
  .back{ width:44px; height:44px; border:none; background:transparent; border-radius:50%; display:grid; place-items:center;
    color:var(--violet); cursor:pointer }
  .sh-h{ font-size:25px; font-weight:700; letter-spacing:-.7px; margin:0 }
  .sh-s{ font-size:14.5px; color:var(--ink2); letter-spacing:-.15px; margin-top:2px }
  .lbl{ font-size:15px; font-weight:600; letter-spacing:-.2px; color:var(--ink2); margin:24px 4px 10px }
  .panel{ background:var(--card); border-radius:18px; box-shadow:inset 0 0 0 1px var(--ring) }
  .pad{ padding:15px 16px }
  .grid2{ display:flex; flex-wrap:wrap; gap:10px }
  .fact{ flex:1 1 44%; background:var(--card); border-radius:14px; padding:12px 14px; box-shadow:inset 0 0 0 1px var(--ring) }
  .fact s{ display:block; font-size:13.5px; font-weight:400; letter-spacing:-.1px; color:var(--ink2); text-decoration:none }
  .fact b{ display:block; font-size:17px; font-weight:600; letter-spacing:-.35px; margin-top:4px }

  .pipe{ display:flex; align-items:flex-start; padding:18px 6px 10px }
  .pstep{ flex:1 1 0; position:relative; display:flex; flex-direction:column; align-items:center }
  .pstep .ln{ position:absolute; top:6.5px; height:3px; border-radius:2px; background:var(--hair) }
  .pstep .ln.l{ left:0; right:50% } .pstep .ln.r{ left:50%; right:0 }
  .pstep .ln.fill{ background:var(--violet-solid) }
  .pdot{ position:relative; width:15px; height:15px; border-radius:50%; background:var(--hair) }
  .pdot.done{ background:var(--violet-solid) }
  .pdot.now{ background:var(--card); border:4px solid var(--violet-solid); box-shadow:0 0 0 5px var(--violet-wash) }
  .pstep s{ margin-top:10px; font-size:10.5px; font-weight:700; color:var(--ink3); text-decoration:none; text-align:center }
  .pstep.act s{ color:var(--ink) }

  .tl{ display:flex; align-items:baseline; gap:12px; padding:9px 0; position:relative }
  .tl::before{ content:""; position:absolute; left:4.5px; top:16px; bottom:-9px; width:1.5px; background:var(--hair) }
  .tl.last::before{ display:none }
  .tl-dot{ flex:0 0 auto; width:10px; height:10px; border-radius:50%; background:var(--violet-solid); margin-top:5px }
  .tl-l{ flex:1 1 auto; font-size:15.5px; letter-spacing:-.2px }
  .tl-t{ flex:0 0 auto; font-size:15px; font-weight:600; color:var(--ink2) }
  .dl-item{ display:flex; gap:12px; align-items:baseline; padding:3px 0 }
  .dl-qty{ font-size:15.5px; font-weight:700; color:var(--ink3); min-width:26px }
  .dl-item span{ font-size:16.5px; letter-spacing:-.3px }
  .dl-extra{ font-size:14px; color:var(--lilac-ink); margin:2px 0 8px 38px; letter-spacing:-.1px }
  .dl-extra-tag{ color:var(--ink3); font-weight:600 }

  .row{ display:flex; align-items:center; gap:14px; padding:13px 16px; border-top:1px solid var(--hair);
    background:transparent; border-left:none; border-right:none; border-bottom:none; width:100%; text-align:left; cursor:pointer; color:inherit }
  .row:first-child{ border-top:none }
  .row .av{ flex:0 0 auto; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; font-size:17px; font-weight:700; color:#fff }
  .row .m{ flex:1 1 auto; min-width:0 }
  .row .m b{ display:block; font-size:17px; font-weight:600; letter-spacing:-.35px }
  .row .m s{ display:block; font-size:14px; color:var(--ink2); text-decoration:none; margin-top:2px }
  .row .d{ flex:0 0 auto; font-size:17px; font-weight:700; color:var(--ink2) }
  .row[disabled]{ opacity:.45; cursor:default }

  .btn{ display:block; width:100%; padding:16px; border:none; border-radius:14px; font-size:17px; font-weight:700;
    letter-spacing:-.35px; cursor:pointer; margin-top:12px; transition:transform .14s var(--ease) }
  .btn:active{ transform:scale(.985) }
  .btn-p{ background:var(--violet-solid); color:#fff; box-shadow:var(--lift-accent) }

XPD.initDelivery(firebaseConfig);

$('screen-login').addEventListener('submit', async (e) => {

// ── Theme: sistema / claro / oscuro, persisted ──
function applyTheme(){

let theme = (() => { try { return localStorage.getItem('dl-theme') || 'system'; } catch { return 'system'; } })();

applyTheme();

  XPD.subscribeToScheduledOrders((s) => { STORE.scheduled = s || {}; lastData = Date.now(); renderBoard(); });

  try {

      connected = snap.val() === true;

    });
  } catch { /* liveness is auxiliary: the board still works */ }

};

// ── Staff web push (opt-in, the SECOND and ONLY other RTDB write) ──
const VAPID_PUBLIC_KEY_B64 = "BE5fD1EXpWBalKvLopadT1n7ffCE0o0vBDB-JCRIB9Lrn7AyrA953IWLyIqy1-_24wSZ_TKas1gWC-08NecHxWQ";
const urlB64ToU8 = (b64) => { const pad='='.repeat((4-b64.length%4)%4); const s=(b64+pad).replace(/-/g,'+').replace(/_/g,'/'); const raw=atob(s); return Uint8Array.from([...raw].map(c=>c.charCodeAt(0))); };

    standalone: matchMedia('(display-mode: standalone)').matches || navigator.standalone === true,
    iosVersion: /iPhone|iPad|iPod/.test(navigator.userAgent) ? iosVer() : null,

    .then((reg) => reg.pushManager.getSubscription())
    .then((s) => { if (s) pushOn = true; })
    .catch(() => {});

// A notification tap (SW postMessage) or a cold "#order=<id>" open → open that order's detail.
let __pendingOrderId = (() => { const m = String(location.hash || '').match(/order=([^&]+)/); return m ? decodeURIComponent(m[1]) : null; })();
function openOrderWhenReady(orderId){
  if (!orderId) return;
  if (STORE.orders[orderId] || STORE.scheduled[orderId]) { __pendingOrderId = null; openDetail(orderId); }
  else { __pendingOrderId = orderId; }
}
navigator.serviceWorker?.addEventListener('message', (e) => { if (e.data?.type === 'open-order' && e.data.orderId) openOrderWhenReady(e.data.orderId); });

// ── helpers ──
function escapeHtml(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' })[c]);
}
// Human-facing label — '#<display_number>' once the server allocates one, else a short order-id
// fallback. DISPLAY ONLY; never used as a key/selector/arg.
function displayLabel(id, order){
  const dn = order && order.display_number;
  if (Number.isFinite(dn)) return '#' + dn;
  const s = id != null ? String(id) : '';
  return s ? '#' + s.slice(-4).toUpperCase() : '#—';
}
// DISPLAY-ONLY driver resolution, mirroring the desktop's order-detail modal
// (xpizza-dispatch/index.html:4314): the driver lives on EITHER task, and assignOrderToDriver sets
// both — but a path that stamps only the pickup task still identifies who took the order. The
// phone was reading _delivery alone, which is why it said "Sin repartidor asignado" for orders the
// desktop correctly attributes.
// NOT a replacement for board-model's assignedDriverId(): that one keys on the _delivery task by
// design and drives isUnassignedDelivery/canReassign, i.e. the assignment CAS. It stays untouched.
function displayDriverId(id, order){
  const dt = STORE.tasks[`${id}_delivery`], pt = STORE.tasks[`${id}_pickup`];
  const byKey = (dt && dt.assigned_driver_id) || (pt && pt.assigned_driver_id);
  if (byKey) return byKey;
  // NOTE ON WHY THIS OFTEN FINDS NOTHING — and it is not a key-naming problem.
  // The key convention is correct: the order's own delivery_task_id resolves to
  // `<orderId>_delivery` exactly. The task is simply GONE. retentionSweepTasks
  // (xpizza-functions/index.js:3965) deletes terminal orders' tasks every 6 hours, and the driver
  // identity lives ONLY on the task — no order field carries it. So for any completed order past
  // one sweep the driver is unrecoverable HERE and on the desktop alike (which resolves it the same
  // way at xpizza-dispatch/index.html:4131 and :4335, and shows "—").
  // The real fix is a delivered_by snapshot written onto the order at completion — see
  // HANDOFF-delivered-by-snapshot.md. This scan stays only as a cheap safety net for tasks that are
  // present but named unexpectedly; it is NOT what makes the driver appear.
  const oid = (order && order.order_id) || id;
  for (const t of Object.values(STORE.tasks)) {
    if (t && t.order_id === oid && t.assigned_driver_id) return t.assigned_driver_id;
  }
  return null;
}
// Same fallback for the tasks themselves, so the timeline finds them too.
function tasksFor(id, order){
  let dt = STORE.tasks[`${id}_delivery`] || null, pt = STORE.tasks[`${id}_pickup`] || null;
  if (dt && pt) return { dt, pt };
  const oid = (order && order.order_id) || id;
  for (const t of Object.values(STORE.tasks)) {
    if (!t || t.order_id !== oid) continue;
    if (!dt && t.type === 'delivery') dt = t;
    if (!pt && t.type === 'pickup') pt = t;
  }
  return { dt, pt };
}
const hhmm = (ts) => {
  if (!Number.isFinite(ts)) return '';
  try {
    return new Intl.DateTimeFormat('en-US', { timeZone: TZ_HN, hour:'numeric', minute:'2-digit', hour12:true })
      .formatToParts(new Date(ts))
      .reduce((a, p) => p.type === 'dayPeriod' ? a + ' ' + p.value.toUpperCase().replace(/[^APM]/g, '')

  } catch { return ''; }
};
// The order's real history, mirroring the desktop timeline (xpizza-dispatch/index.html:4400-4417).
// Only events that actually happened are listed; nothing is inferred.
function timelineHTML(orderId, order){
  const { dt, pt } = tasksFor(orderId, order);
  const hasDrv = !!displayDriverId(orderId, order);
  const ev = [];
  const push = (label, ts) => { if (Number.isFinite(ts)) ev.push({ label, ts }); };
  push('Pedido recibido', order.created_at);
  // Only claim an assignment happened when one did. The desktop falls back to the pickup task's
  // created_at, which stamps "Repartidor asignado" at task CREATION even when nobody was ever
  // assigned — the same class of fabrication as reading created_at as a delivery time.
  push('Repartidor asignado', pt && (pt.assigned_at || (hasDrv ? pt.created_at : undefined)));
  push('Repartidor aceptó', pt && pt.accepted_at);
  push('Recogido en restaurante', order.picked_up_at || (pt && pt.completed_at));
  push('Entregado', order.delivered_at || (dt && dt.completed_at));
  push('Cancelado', order.cancelled_at);
  ev.sort((a, b) => a.ts - b.ts);
  if (!ev.length) return '';
  return `<div class="panel" style="padding:6px 16px 10px">${ev.map((e, i) => `
    <div class="tl${i === ev.length - 1 ? ' last' : ''}">
      <span class="tl-dot"></span>
      <span class="tl-l">${escapeHtml(e.label)}</span>
      <span class="tl-t num">${escapeHtml(hhmm(e.ts))}</span>

}

function doneClock(order, id){

  if (!t) return '';

    return new Intl.DateTimeFormat('en-US', { timeZone:'America/Tegucigalpa', hour:'numeric', minute:'2-digit', hour12:true })
      .formatToParts(new Date(t))
      .reduce((acc, p) => p.type === 'dayPeriod' ? acc + ' ' + p.value.toUpperCase().replace(/[^APM]/g, '') : (p.type === 'literal' && p.value === ' ' ? acc : acc + p.value), '');
  } catch { return ''; }
}

// uses. Completados is capped to today so the list can't grow without bound over a service.
const dayKey = (ms) => {
  try { return new Intl.DateTimeFormat('en-CA', { timeZone: TZ_HN, year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date(ms)); }
  catch { return ''; }
};
const brandKey = (o) => (o && o.restaurant_id === 'la_musa' ? 'lm' : 'xp');
const brandMark = (o) => (brandKey(o) === 'lm' ? 'M' : 'X');
const brandName = (o) => (brandKey(o) === 'lm' ? 'La Musa' : 'X. Pizza');
const slotLabelSafe = (ms) => { try { return slotLabel(Number(ms), Date.now()); } catch { return ''; } };
const minutesOf = (o) => Math.floor(agingSeconds(agingBaselineMs(o), Date.now()) / 60);
// When an order actually finished. delivered_at is stamped on delivery completion
// (xpizza-delivery.js completeTask); pickups fall back through picked_up_at to created_at.
// TWO different questions, deliberately not the same function.
// finishedAt: when the order ACTUALLY finished. Only a real completion stamp counts.
// completeTask() writes delivered_at; the KDS close (xpizza-kitchen setOrderStatus(id,'completed'))
// writes ONLY { status } and stamps nothing — so a KDS-closed order has no finish time and we must
// not invent one. Falling back to created_at here relabelled "placed at 2:35" as "delivered at 2:35".
// Read BOTH records. completeTask() writes orders/<id>/delivered_at and

const finishedAt = (o, id) => {

};
// sortKey: ordering only, where an approximate key is fine and every order needs one.
const completedAt = (o, id) => finishedAt(o, id) || (Number.isFinite(o && o.picked_up_at) ? o.picked_up_at : 0)
  || (Number.isFinite(o && o.created_at) ? o.created_at : 0);

const SECTION_LABELS = { nuevos:'Nuevos', preparacion:'En preparación', listos:'Listos', camino:'En camino', completados:'Completados' };
const STATUS_ES = { nuevos:'en cocina', preparacion:'en cocina', listos:'listo', camino:'en camino', completados:'entregado' };
const DRIVER_STATUS_ES = {
  off_shift:'Fuera de turno', available:'Disponible', assigned:'Asignado',
  at_restaurant:'En restaurante', en_route_delivery:'En camino', returning:'Regresando', on_break:'En descanso',
};

// Urgency: what the phone is actually for. Colour answers "does this need me", never "what stage is it".
function levelOf(id, order){
  const sec = sectionForOrder(order);
  if (sec === 'completados') return 'done';
  const secs = agingSeconds(agingBaselineMs(order), Date.now());
  const unassigned = isUnassignedDelivery(order, id, STORE.tasks);
  // Thresholds: call agingBand() BARE so both surfaces read the module default (5 min amber /
  // 10 min red) — the desktop calls it bare too, so the phone can never drift from the board again.
  // The clock is total age from created_at, so heat applies ONLY while the order is still the
  // kitchen's problem, or while it has no driver — an order 25 min into a normal delivery is not
  // late, and reddening it would drown the orders that are.
  const heats = sec === 'nuevos' || sec === 'preparacion' || unassigned;
  const band = heats ? agingBand(secs) : 'green';
  if (unassigned && band !== 'green') return 'act';
  if (band === 'red') return 'act';
  if (unassigned) return 'watch';
  const drvId = assignedDriverId(id, STORE.tasks);
  if (drvId && XPD.isStalePing((STORE.drivers[drvId] || {}).last_ping)) return 'watch';
  if (band === 'amber') return 'watch';
  return 'calm';
}
function dotVar(id, order){
  const sec = sectionForOrder(order);
  if (sec === 'camino') return 'var(--sky-ink)';
  if (sec === 'listos') return 'var(--mint-ink)';
  return 'var(--ink3)';
}
// Two parts, not a dot-joined string: the fact that matters carries weight, the stage recedes.
function stateParts(id, order){
  const sec = sectionForOrder(order);
  if (sec === 'completados') return { lead:'Entregado', tail: doneClock(order, id) };
  if (order.order_type === 'pickup') return { lead:'Pickup', tail: STATUS_ES[sec] || '' };
  const drvId = assignedDriverId(id, STORE.tasks);
  if (!drvId) return { lead:'Sin repartidor', tail: STATUS_ES[sec] || '' };
  const d = STORE.drivers[drvId] || {};
  const first = String(d.name || 'Repartidor').split(' ')[0];
  return XPD.isStalePing(d.last_ping) ? { lead:first, tail:'sin señal' } : { lead:first, tail: STATUS_ES[sec] || '' };
}
function oneLineItems(order){ return (order && order.items_text) ? String(order.items_text) : '—'; }

// Itemized order summary — parses the same ' | '-joined items_text the KDS parses, so the phone reads
// identically to the kitchen screen.
function renderOrderItems(order){
  const itemsText = order && order.items_text;
  if (!itemsText || itemsText === '—') return '<div class="dl-item"><span style="color:var(--ink2)">Sin detalle del pedido</span></div>';
  const parts = [];
  let depth = 0, cur = '';
  for (let i = 0; i < itemsText.length; i++) {
    const c = itemsText[i];
    if (c === '[') depth++;
    else if (c === ']') depth--;
    if (depth === 0 && itemsText.slice(i, i + 3) === ' | ') { parts.push(cur.trim()); cur = ''; i += 2; }
    else cur += c;
  }
  if (cur.trim()) parts.push(cur.trim());

  return parts.map(part => {
    const m = part.match(/^(\d+)x\s+(.+?)(?:\s+\(L[\d.]+\))?(?:\s+\[(.+)\])?$/);
    if (!m) return `<div class="dl-item"><span>${escapeHtml(part)}</span></div>`;
    const qty = parseInt(m[1], 10);
    const name = escapeHtml(m[2]);
    const extrasRaw = m[3] ? escapeHtml(m[3]) : m[3];
    let extrasHtml = '';
    if (extrasRaw) {
      if (extrasRaw.includes('Pizza ')) {
        const perPizza = extrasRaw.split(/\s*\|\s*(?=Pizza \d)/);
        if (qty === 1) {
          extrasHtml = `<div class="dl-extra">${perPizza[0].replace(/^Pizza \d+:\s*/, '').trim()}</div>`;
        } else {
          const allSame = perPizza.length === qty && perPizza.every((p, i, arr) =>
            p.replace(/^Pizza \d+:\s*/, '').trim() === arr[0].replace(/^Pizza \d+:\s*/, '').trim());
          extrasHtml = allSame
            ? `<div class="dl-extra">${perPizza[0].replace(/^Pizza \d+:\s*/, '').trim()} <span class="dl-extra-tag">· todas</span></div>`
            : perPizza.map(p => `<div class="dl-extra">${p.trim()}</div>`).join('');
        }
      } else {
        extrasHtml = `<div class="dl-extra">${extrasRaw}</div>`;
      }
    }
    return `<div class="dl-item"><span class="dl-qty rd num">${qty}×</span><span>${name}</span></div>${extrasHtml}`;
  }).join('');
}

const IC_PHONE = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h3l2 5-2.5 1.5a13 13 0 0 0 6 6L15 13l5 2v3a2 2 0 0 1-2.2 2A17 17 0 0 1 3 5.2 2 2 0 0 1 5 3z"/></svg>';

const IC_BACK  = '<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>';

// ── liveness pill ──
function renderLive(){
  const el = $('live'); if (!el) return;

// ── board ──
const PEEK = 80;

function passHTML(id, order){
  const lv = levelOf(id, order);
  const done = lv === 'done';
  const m = minutesOf(order);
  // LIVE: the delivery task is the truth — it is what the assignment CAS keys on, so showing a
  // pickup-task driver here would contradict the "Sin repartidor" chip beside it.
  // DONE: the question changes to "who delivered this", so read either task, like the desktop.
  const drvId = done ? displayDriverId(id, order) : assignedDriverId(id, STORE.tasks);
  const d = drvId ? (STORE.drivers[drvId] || {}) : null;
  const isOpen = openPass === id;
  const isProg = order.status === 'scheduled';

  let right;
  if (done) right = '';
  else if (d) right = `<span class="av rd" data-av="${escapeHtml(id)}">${escapeHtml(String(d.name || '?').charAt(0).toUpperCase())}</span>`;
  else if (order.order_type === 'pickup') right = `<span class="av">${IC_STORE}</span>`;
  else right = `<span class="av empty">${IC_PLUS}</span>`;

  const timeCol = done
    ? `<span class="t" style="display:grid;place-items:center;height:42px" title="${escapeHtml(doneClock(order, id))}">${IC_CHECK}</span>`
    : isProg
      ? `<span class="t rd" style="font-size:13px;font-weight:700;color:var(--lilac-ink);line-height:1.2">${escapeHtml(slotLabelSafe(order.scheduled_for))}</span>`
      : `<span class="t rd num"><b>${m}</b><s>min</s></span>`;

  // Every pass expands, completed ones included — the owner still needs to reach a customer after
  // delivery, and a pass that opens onto nothing is worse than one that does not open at all.
  // canReassign() already returns false for completados, so no assign button appears there.
  const phone = String(order.customer_phone || order.phone || '').replace(/[^+\d]/g, '');
  const callBtn = phone
    ? `<a class="pact mini" href="tel:${escapeHtml(phone)}" aria-label="Llamar a ${escapeHtml(order.customer_name || 'cliente')}">${IC_PHONE}</a>`
    : '';
  const assignBtn = canReassign(order, id, STORE.tasks)
    ? `<button class="pact solid" type="button" data-pick="${escapeHtml(id)}">${drvId ? 'Reasignar' : 'Asignar'}</button>`
    : '';
  const byLine = done && d
    ? `<div class="ln" style="margin-top:3px">Entregado por ${escapeHtml(String(d.name || 'repartidor').split(' ')[0])}</div>`
    : '';
  const body = `<div class="pbody">
    <div class="ln">${escapeHtml(order.address_detected || order.address_details || '—')}</div>
    <div class="ln" style="margin-top:3px">${escapeHtml(oneLineItems(order))}</div>
    ${byLine}
    <div class="pacts">${callBtn}<button class="pact" type="button" data-detail="${escapeHtml(id)}">Ver pedido</button>${assignBtn}</div>
  </div>`;

  return `<div class="pass lv-${lv}${isOpen ? ' open' : ''}" data-pass="${escapeHtml(id)}">
    <button class="peek" type="button" data-toggle="${escapeHtml(id)}" aria-expanded="${isOpen}">
      ${timeCol}
      <span class="m">
        <span class="r1">
          <span class="nm">${escapeHtml(order.customer_name || 'Cliente')}</span>
          <span class="bm" style="background:var(--${brandKey(order)})">${brandMark(order)}</span>
          <span class="onum num">${escapeHtml(displayLabel(id, order))}</span>
        </span>
        <span class="st">${done ? '' : `<i style="background:${dotVar(id, order)}"></i>`}<b>${escapeHtml(stateParts(id, order).lead)}</b>${stateParts(id, order).tail ? `<q>${escapeHtml(stateParts(id, order).tail)}</q>` : ''}</span>
      </span>
      ${right}
    </button>${body}
  </div>`;
}

function deckHTML(entries){
  return `<div class="deck">${entries.map(([id, o]) => passHTML(id, o)).join('')}</div>`;
}

// Set by a successful assignment, consumed by the next render. Expires so a board that never
// re-rendered (offline, backgrounded) can't play a stale animation minutes later.
let pendingSettle = null;

function playSettle(st){
  const el = document.querySelector(`.pass[data-pass="${st.id}"]`);
  if (!el) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { el.scrollIntoView({ block:'nearest' }); return; }
  // FLIP: the pass has just been re-sorted into another deck. Move it back to where the eye last
  // saw it, then let it travel to its new home, so the migration reads as a consequence.
  if (st.from) {
    const to = el.getBoundingClientRect();
    const dy = st.from - to.top;
    if (Math.abs(dy) > 2) {
      el.style.transition = 'none';
      el.style.transform = `translateY(${dy}px)`;
      void el.offsetHeight;
      el.style.transition = 'transform .62s var(--ease)';
      el.style.transform = '';
      setTimeout(() => { el.style.transition = ''; el.style.transform = ''; }, 720);
    }
  }
  const av = el.querySelector('[data-av]');
  if (av) { av.classList.add('av-fill'); setTimeout(() => av.classList.remove('av-fill'), 560); }
  setTimeout(() => el.scrollIntoView({ block:'nearest', behavior:'smooth' }), 80);
}

function layoutDecks(){
  document.querySelectorAll('.deck').forEach((deck) => {
    const passes = deck.querySelectorAll('.pass');
    passes.forEach((p, i) => {
      if (i === 0) { p.style.marginTop = '0px'; return; }
      const prev = passes[i - 1];
      p.style.marginTop = prev.classList.contains('open') ? '0px' : `${-(prev.offsetHeight - PEEK)}px`;
    });
  });
}

function renderChips(){
  const counts = chipCounts(STORE.orders, STORE.tasks, Object.keys(STORE.scheduled).length);
  const defs = [
    { k:'todos', l:'Todos', n:counts.todos },
    { k:'unassigned', l:'Sin repartidor', n:counts.unassigned, alert:true },
    { k:'delivery', l:'Entrega', n:counts.delivery },
    { k:'pickup', l:'Pickup', n:counts.pickup },
    { k:'programados', l:'Programados', n:counts.programados },
  ];
  $('chips').innerHTML = defs.map(c =>
    `<button class="chip${c.alert ? ' alert' : ''}" type="button" data-chip="${c.k}" aria-pressed="${activeChip === c.k}">${escapeHtml(c.l)}<span class="ct num">${c.n}</span></button>`
  ).join('');
}

function renderBoard(){
  if (!started || tab !== 'pedidos') return;
  const pane = $('pane');
  const keep = pane.scrollTop;
  renderChips();

  let html = '';

  if (activeChip === 'programados') {
    const groups = groupScheduledBySlot(STORE.scheduled, Date.now());
    html = groups.length
      ? groups.map(g => `<div class="slot-h">${escapeHtml(g.label)}</div>${deckHTML(g.orders.map(({id, order}) => [id, order]))}`).join('')
      : `<div class="empty"><b>Sin programados</b><p>No hay pedidos agendados para más tarde.</p></div>`;
  } else {
    const ids = Object.keys(STORE.orders).filter(id => matchesChip(STORE.orders[id], id, STORE.tasks, activeChip));
    const bucket = { act:[], watch:[], calm:[], done:[] };
    for (const id of ids) bucket[levelOf(id, STORE.orders[id])].push(id);
    const sortLive = (a, b) => orderCompare(STORE.orders[a], STORE.orders[b]);
    const ahora = [...bucket.act, ...bucket.watch].sort(sortLive).map(id => [id, STORE.orders[id]]);
    const curso = bucket.calm.sort(sortLive).map(id => [id, STORE.orders[id]]);
    // Completados is a history list: most recently finished first, by completion time.
    // orderCompare() is the LIVE-board comparator (pickup after delivery, then oldest first) — using
    // it here interleaved the two types and put the oldest at the top, which read as unsorted.
    const today = dayKey(Date.now());
    const hechos = bucket.done
      .filter(id => dayKey(completedAt(STORE.orders[id], id)) === today)
      .sort((a, b) => completedAt(STORE.orders[b], b) - completedAt(STORE.orders[a], a))
      .map(id => [id, STORE.orders[id]]);

    if (!ids.length) {
      html = `<div class="empty"><b>Nada por aquí</b><p>Ningún pedido coincide con este filtro.</p></div>`;
    } else {
      html += ahora.length
        ? `<div class="sec">Ahora<span class="n num">${ahora.length}</span></div>${deckHTML(ahora)}`
        : `<div class="empty" style="padding:30px 24px"><b>Todo bajo control</b><p>Ningún pedido necesita tu atención ahora mismo.</p></div>`;
      if (curso.length) html += `<div class="sec">En curso<span class="n num">${curso.length}</span></div>${deckHTML(curso)}`;
      if (hechos.length) {
        html += `<button class="sec" type="button" data-donetoggle="1" aria-expanded="${!collapsedDone}">${IC_CHEV}Completados hoy<span class="n num">${hechos.length}</span></button>`;
        if (!collapsedDone) html += deckHTML(hechos);
      }
      if (activeChip === 'todos') {
        const groups = groupScheduledBySlot(STORE.scheduled, Date.now());
        if (groups.length) {
          html += `<div class="sec">Programados<span class="n num">${groups.reduce((n,g)=>n+g.orders.length,0)}</span></div>`;
          html += groups.map(g => `<div class="slot-h">${escapeHtml(g.label)}</div>${deckHTML(g.orders.map(({id, order}) => [id, order]))}`).join('');
        }
      }
    }
  }

  pane.innerHTML = html;
  pane.scrollTop = keep;
  layoutDecks();
  if (animateBoard) { animateBoard = false; replay(pane, 'list-in'); }

  if (pendingSettle) {
    const st = pendingSettle;
    pendingSettle = null;
    if (Date.now() - st.at < 6000) requestAnimationFrame(() => playSettle(st));
  }

  const activeIds = Object.keys(STORE.orders).filter(id => { const s = sectionForOrder(STORE.orders[id]); return s && s !== 'completados'; });
  const unassigned = activeIds.filter(id => isUnassignedDelivery(STORE.orders[id], id, STORE.tasks)).length;
  $('head-sub').innerHTML = `${activeIds.length} activo${activeIds.length === 1 ? '' : 's'}${unassigned ? `, <b>${unassigned} sin repartidor</b>` : ''}`;

  if (__pendingOrderId) openOrderWhenReady(__pendingOrderId);
}

// ── drivers roster ──
function driverColorVar(d){
  if (!d) return 'var(--ink3)';
  if (d.status === XPD.DRIVER_STATUS.OFF_SHIFT) return 'var(--ink3)';
  if (XPD.isStalePing(d.last_ping)) return 'var(--lilac-ink)';
  if (d.status === 'en_route_delivery' || d.status === 'returning' || d.status === 'assigned') return 'var(--sky-ink)';
  return 'var(--mint-ink)';
}
function orderForDriver(uid){
  for (const id of Object.keys(STORE.orders)) {
    const sec = sectionForOrder(STORE.orders[id]);
    if (sec === null || sec === 'completados') continue;
    if (assignedDriverId(id, STORE.tasks) === uid) return id;
  }
  return null;
}
function driverRow(uid, d){
  const oid = orderForDriver(uid);
  const statusEs = DRIVER_STATUS_ES[d.status] || d.status || '—';
  const lead = XPD.isStalePing(d.last_ping) ? 'Sin señal' : statusEs;
  return `<button class="row" type="button" data-drvfocus="${escapeHtml(uid)}">
    <span class="av rd" style="background:${driverColorVar(d)}">${escapeHtml(String(d.name || '?').charAt(0).toUpperCase())}</span>
    <span class="m"><b>${escapeHtml(d.name || 'Repartidor')}</b><s>${escapeHtml(lead)}, ${oid ? escapeHtml(displayLabel(oid, STORE.orders[oid])) : 'sin pedido'}</s></span>
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--ink3)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
  </button>`;
}
function renderDriversTab(){
  const all = Object.entries(STORE.drivers).filter(([, d]) => d && (d.name || typeof d.lat === 'number' || d.status));
  const byLiveName = ([, a], [, b]) =>
    (XPD.isStalePing(a.last_ping) ? 1 : 0) - (XPD.isStalePing(b.last_ping) ? 1 : 0)
    || String(a.name || '').localeCompare(String(b.name || ''));
  const on = all.filter(([, d]) => d.status !== XPD.DRIVER_STATUS.OFF_SHIFT).sort(byLiveName);
  const off = all.filter(([, d]) => d.status === XPD.DRIVER_STATUS.OFF_SHIFT).sort(byLiveName);
  $('pane').innerHTML = (on.length || off.length)
    ? `<div class="sec">En turno<span class="n num">${on.length}</span></div>
       <div class="panel">${on.map(([u, d]) => driverRow(u, d)).join('') || '<div class="empty" style="padding:24px"><p>Nadie en turno.</p></div>'}</div>
       <div class="sec">Fuera de turno<span class="n num">${off.length}</span></div>
       <div class="panel">${off.map(([u, d]) => driverRow(u, d)).join('') || '<div class="empty" style="padding:24px"><p>Nadie fuera de turno.</p></div>'}</div>`
    : `<div class="empty"><b>Sin repartidores</b><p>Todavía no hay repartidores registrados.</p></div>`;
}

// ── tabs ──
function showTab(which){
  tab = which;
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === which)));
  $('head-title').textContent = which === 'pedidos' ? 'Pedidos' : which === 'mapa' ? 'Mapa' : 'Repartidores';
  $('head-sub').classList.toggle('hidden', which !== 'pedidos');
  $('chips').classList.toggle('hidden', which !== 'pedidos');
  $('pane').classList.toggle('hidden', which === 'mapa');
  $('map-wrap').classList.toggle('hidden', which !== 'mapa');
  if (which === 'pedidos') renderBoard();
  if (which === 'drivers') renderDriversTab();
  if (which === 'mapa') window.__onMapaShown?.();
  replay(which === 'mapa' ? $('map-wrap') : $('pane'), 'pane-in');
}

// ── sheet plumbing ──
let lastFocus = null;
function openSheet(html){
  const wasOpen = $('sheet').classList.contains('on');
  if (!wasOpen) lastFocus = document.activeElement;
  $('sheet-body').innerHTML = html;
  $('sheet-body').scrollTop = 0;
  // Animate a step only WITHIN an already-open sheet; the sheet's own rise covers the first one.
  if (wasOpen && sheetDir) replay($('sheet-body'), sheetDir === 'pop' ? 'sh-pop' : 'sh-push');
  sheetDir = null;
  $('scrim').classList.add('on');
  $('sheet').classList.add('on');
  $('screen-main').setAttribute('aria-hidden', 'false');
  const f = $('sheet').querySelector('button:not([disabled]), a[href]');
  if (f) setTimeout(() => f.focus(), 60);
}
function closeSheet(){
  $('scrim').classList.remove('on');
  $('sheet').classList.remove('on');
  $('sheet-body').innerHTML = '';
  pickerFromDriver = null; pickerIsReassign = false;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
  lastFocus = null;
}
$('scrim').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('sheet').classList.contains('on')) closeSheet();
});
// Keep Tab inside the sheet while it is open.
document.addEventListener('focusin', (e) => {
  const sheet = $('sheet');
  if (!sheet.classList.contains('on')) return;
  if (!sheet.contains(e.target) && e.target !== document.body) {
    const f = sheet.querySelector('button:not([disabled]), a[href], input');
    if (f) f.focus();
  }
});

let _toastT;
function toast(msg, bad){
  const el = $('toast');
  el.textContent = msg;
  el.className = bad ? 'on bad' : 'on';
  clearTimeout(_toastT);
  _toastT = setTimeout(() => { el.className = bad ? 'bad' : ''; }, 2800);
}

// Failure copy — mirrors the desktop's assignFailMsg.
function assignFailMsg(reason){
  switch (reason) {
    case 'already_assigned':
    case 'pickup_taken': return 'Ya fue asignada a otro repartidor';
    case 'claim_stale': return 'La asignación cambió — el tablero ya se actualizó, intentá de nuevo';
    case 'write_failed': return 'No se pudo asignar (error de red) — reintentá';
    default: return 'No se pudo asignar';
  }
}

// ── detail sheet ──
const STAGE_ORDER = ['nuevos', 'preparacion', 'listos', 'camino', 'completados'];
const STAGE_LABEL = { nuevos:'Nuevo', preparacion:'Cocina', listos:'Listo', camino:'Camino', completados:'Entregado' };

function pipeHTML(order){
  const sec = sectionForOrder(order);
  const idx = Math.max(0, STAGE_ORDER.indexOf(sec));
  const isPickup = order.order_type === 'pickup';
  const stages = isPickup ? ['nuevos', 'preparacion', 'listos', 'completados'] : STAGE_ORDER;
  const here = Math.max(0, stages.indexOf(sec));
  return `<div class="panel"><div class="pipe">${stages.map((s, i) => {
    const cls = i < here ? 'done' : i === here ? 'now' : '';
    return `<span class="pstep${i <= here ? ' act' : ''}">
      ${i === 0 ? '' : `<span class="ln l${i <= here ? ' fill' : ''}"></span>`}
      ${i === stages.length - 1 ? '' : `<span class="ln r${i < here ? ' fill' : ''}"></span>`}
      <span class="pdot ${cls}"></span><s>${STAGE_LABEL[s]}</s></span>`;
  }).join('')}</div></div>`;
}

function fmtDist(mtrs){
  if (!Number.isFinite(mtrs)) return '—';
  return mtrs >= 1000 ? (mtrs / 1000).toFixed(1).replace('.', ',') + ' km' : Math.round(mtrs) + ' m';
}

function openPicker(orderId){
  const order = STORE.orders[orderId] || STORE.scheduled[orderId];
  if (!order) return;
  // FROZEN write setup: freeze the from-driver AS SHOWN at pick-open — reassignOrder's CAS anchors on
  // pickerFromDriver so a moved order aborts instead of clobbering.
  pickerFromDriver = assignedDriverId(orderId, STORE.tasks);
  pickerIsReassign = !!pickerFromDriver;
  const hub = HUBS[order.restaurant_id] || HUBS.x_pizza;
  const list = driverPickList({ order, orderId, drivers:STORE.drivers, tasks:STORE.tasks, hub, now:Date.now(), isStale:XPD.isStalePing });

  // Off-shift drivers are NOT offered. driverPickList ranks by distance alone, which put a driver
  // who had gone home — but parked near the restaurant — at the top of the list for the app's only
  // mutation. The map already excludes them; the picker now agrees.
  const onShift = list.filter(r => (STORE.drivers[r.id] || {}).status !== XPD.DRIVER_STATUS.OFF_SHIFT);
  const hiddenOff = list.length - onShift.length;
  const bucketOf = (r) => {
    const st = (STORE.drivers[r.id] || {}).status;
    return (st === 'available' || st === 'at_restaurant') ? 'free' : 'busy';
  };
  const rowOf = (r) => {
    const dObj = STORE.drivers[r.id] || {};
    // Say the exception, not the normal case: "GPS activo" on every row is noise.
    const statusEs = r.live ? (DRIVER_STATUS_ES[dObj.status] || r.status || '') : 'Sin señal';
    return `<button class="row" type="button" data-choose="${escapeHtml(r.id)}"${r.isCurrent ? ' disabled' : ''}>
      <span class="av rd" style="background:${driverColorVar(dObj)}">${escapeHtml(String(r.name || '?').charAt(0).toUpperCase())}</span>
      <span class="m"><b>${escapeHtml(r.name)}${r.isCurrent ? ' <span style="font-size:12px;font-weight:600;color:var(--ink3)">— actual</span>' : ''}</b>
      <s>${escapeHtml(statusEs)}, ${r.load} pedido${r.load === 1 ? '' : 's'}</s></span>
      <span class="d rd num">${fmtDist(r.distanceM)}</span>
    </button>`;
  };
  const group = (rows, title, colour) => rows.length
    ? `<div class="lbl" style="color:${colour}">${title}</div><div class="panel">${rows.map(rowOf).join('')}</div>` : '';

  const free = onShift.filter(r => bucketOf(r) === 'free');
  const busy = onShift.filter(r => bucketOf(r) === 'busy');

  const offNote = hiddenOff
    ? `<p style="font-size:13.5px;color:var(--ink2);line-height:1.45;margin:18px 4px 0">${hiddenOff} repartidor${hiddenOff === 1 ? '' : 'es'} fuera de turno no ${hiddenOff === 1 ? 'se muestra' : 'se muestran'}.</p>`
    : '';

  const body = onShift.length
    ? group(free, 'Disponibles', 'var(--mint-ink)') + group(busy, 'En entrega', 'var(--sky-ink)') + offNote
    : `<div class="empty"><b>No hay repartidores en turno</b><p>${hiddenOff ? `${hiddenOff} está${hiddenOff === 1 ? '' : 'n'} fuera de turno. Alguien tiene que entrar antes de poder asignar.` : 'Nadie está registrado todavía.'}</p></div>`;

  openSheet(`
    <div class="sh-nav">
      <button class="back" type="button" data-detail="${escapeHtml(orderId)}" data-back="1" aria-label="Atrás">${IC_BACK}</button>
      <h2 id="sheet-title" class="sh-h rd">Elegir repartidor</h2>
    </div>
    <div class="sh-s" style="margin-left:4px">${escapeHtml(order.customer_name || 'Cliente')}, ${escapeHtml(order.address_detected || order.address_details || '—')}</div>
    ${body}
  `);
}

async function commitAssign(orderId, driverId){
  const btn = $('confirm-yes');
  if (btn) { btn.disabled = true; btn.textContent = 'Asignando…'; }
  try {
    // THE ONE (RE)ASSIGNMENT WRITE — desktop path per case.
    const res = pickerIsReassign
      ? await XPD.reassignOrder(orderId, driverId, pickerFromDriver)
      : await XPD.assignOrderToDriver(orderId, driverId);
    if (res && res.ok) {
      const name = String((STORE.drivers[driverId] || {}).name || 'repartidor').split(' ')[0];
      // Capture the pass's current position BEFORE the data lands and re-sorts the board.
      const before = document.querySelector(`.pass[data-pass="${orderId}"]`);
      pendingSettle = { id: orderId, at: Date.now(), from: before ? before.getBoundingClientRect().top : null };
      toast((pickerIsReassign ? 'Reasignado a ' : 'Asignado a ') + name);
      closeSheet();
    } else {
      toast(assignFailMsg(res?.reason), true);
      if (btn) { btn.disabled = false; btn.textContent = 'Confirmar'; }
    }
  } catch (e) {
    toast('Error de red — reintentá', true);
    if (btn) { btn.disabled = false; btn.textContent = 'Confirmar'; }
  }
}

document.addEventListener('click', (e) => {
  const el = e.target.closest?.('[data-toggle],[data-detail],[data-pick],[data-choose],[data-commit],[data-close],[data-chip],[data-tab],[data-settheme],[data-push],[data-signout],[data-drvfocus],[data-donetoggle],[data-map],[data-back]');
  if (!el) return;
  const ds = el.dataset;

  if (ds.toggle){
    openPass = (openPass === ds.toggle) ? null : ds.toggle;
    document.querySelectorAll('.pass').forEach(p => {
      const on = p.dataset.pass === openPass;
      p.classList.toggle('open', on);
      p.querySelector('.peek')?.setAttribute('aria-expanded', String(on));
    });
    layoutDecks();
    return;
  }
  if (ds.donetoggle){ collapsedDone = !collapsedDone; renderBoard(); return; }
  if (ds.chip){ activeChip = ds.chip; openPass = null; animateBoard = true; renderBoard(); return; }
  if (ds.tab){ showTab(ds.tab); return; }
  if (ds.detail){ sheetDir = ds.back ? 'pop' : 'push'; openDetail(ds.detail); return; }
  if (ds.pick){ sheetDir = ds.back ? 'pop' : 'push'; openPicker(ds.pick); return; }
  if (ds.choose){
    const oid = $('sheet-body').querySelector('[data-detail]')?.dataset.detail;
    if (oid) { sheetDir = 'push'; openConfirm(oid, ds.choose); }
    return;
  }
  if (ds.commit){ commitAssign(ds.order, ds.commit); return; }
  if (ds.close){ closeSheet(); return; }
  if (ds.settheme){
    theme = ds.settheme;
    try { localStorage.setItem('dl-theme', theme); } catch {}
    applyTheme(); openSettings();
    return;
  }
  if (ds.push){ enableStaffPush(); return; }
  if (ds.signout){
    closeSheet();
    XPD.signOutUser().catch(() => toast('No se pudo cerrar sesión', true));
    return;
  }
  if (ds.drvfocus){ showTab('mapa'); window.__focusDriverOnMap?.(ds.drvfocus); return; }
  if (ds.map){ closeSheet(); showTab('mapa'); window.__focusOrderOnMap?.(ds.map); return; }
});

  return loadMaps().then(() => {
    map = new google.maps.Map($('map'), {
      center: { lat:15.5063, lng:-88.0250 }, zoom:13, styles: mapStyles(),
      disableDefaultUI:true, gestureHandling:'greedy',
    });
    mapReady = true;
    driverMarkers = {};   // any markers from a previous instance are orphaned
    if (window.ResizeObserver) new ResizeObserver(() => { if (map) google.maps.event.trigger(map, 'resize'); }).observe($('map-wrap'));
  });
}
// SINGLE-FLIGHT: showTab('mapa') and __focusDriverOnMap/__focusOrderOnMap all call this, and the
// focus helpers await it. Without one shared promise both callers raced past `mapReady` and built a
// SECOND Map on the same div — the first map's markers then lived on a detached instance, so pins
// vanished and never came back (renderDrivers only setIcon()s markers it already has).
window.__onMapaShown = async () => {
  if (mapFailed) return;
  if (!mapInit) {
    mapInit = initMap().catch((e) => {
      mapFailed = true; mapInit = null;
      showMapMsg('Mapa no disponible — tocá para reintentar. El tablero sigue en vivo.');
      throw e;
    });
  }
  try { await mapInit; } catch { return; }
  showMapMsg('');
  google.maps.event.trigger(map, 'resize');
  renderDrivers();
};
$('map-msg').addEventListener('click', () => {
  if (!mapFailed) return;
  mapFailed = false; showMapMsg(''); window.__onMapaShown();
});

// Marker fill by status/staleness. Google markers cannot read CSS custom properties, so these mirror
// the token layer by hand — change one, change the other.
function driverMarkerColor(status, stale){
  if (stale) return '#8B5CF6';                                        // lilac — reachable, just quiet
  switch (status) {
    case 'available': case 'at_restaurant': return '#1F9E6E';         // mint
    case 'en_route_delivery': return '#3B82D6';                       // sky
    case 'returning': case 'assigned': return '#8B5CF6';              // lilac
    default: return '#8E89A6';                                        // ink3
  }
}

function renderDrivers(){
  if (!mapReady) return;
  const strokeCol = resolvedTheme() === 'dark' ? '#131120' : '#ffffff';
  const seen = new Set();
  for (const [uid, d] of Object.entries(STORE.drivers)) {
    if (!d || d.status === XPD.DRIVER_STATUS.OFF_SHIFT) continue;
    if (typeof d.lat !== 'number' || typeof d.lng !== 'number') continue;
    seen.add(uid);
    const stale = XPD.isStalePing(d.last_ping);
    const pos = { lat:d.lat, lng:d.lng };
    const icon = { path: google.maps.SymbolPath.CIRCLE, scale: 13, fillColor: driverMarkerColor(d.status, stale),
                   fillOpacity: 1, strokeColor: strokeCol, strokeWeight: 2.5 };
    const label = { text: (d.name || '?').charAt(0).toUpperCase(), color:'#fff', fontSize:'11px', fontWeight:'700' };
    if (driverMarkers[uid]) {
      if (driverMarkers[uid].getMap() !== map) driverMarkers[uid].setMap(map);   // survive a map re-init
      glide.update(uid, pos, { snap: stale }); driverMarkers[uid].setIcon(icon); driverMarkers[uid].setLabel(label);
    }
    else {
      const mk = new google.maps.Marker({ map, position:pos, icon, label, title: d.name || 'Repartidor', zIndex:1000 });
      mk.addListener('click', () => openDriverInfo(uid));
      driverMarkers[uid] = mk;
    }
  }
  for (const uid of Object.keys(driverMarkers)) if (!seen.has(uid)) { glide.cancel(uid); driverMarkers[uid].setMap(null); delete driverMarkers[uid]; }
}

function openDriverInfo(uid){
  const d = STORE.drivers[uid], mk = driverMarkers[uid];
  if (!d || !mk) return;
  if (!driverInfoWindow) driverInfoWindow = new google.maps.InfoWindow();
  const oid = orderForDriver(uid);
  const ordLabel = oid ? displayLabel(oid, STORE.orders[oid]) : null;
  const statusEs = DRIVER_STATUS_ES[d.status] || d.status || '';
  // Google's bubble is always light — these literals are intentional, not theme tokens.
  driverInfoWindow.setContent(`<div style="font-family:-apple-system,system-ui,sans-serif;padding:1px 3px;min-width:118px">
    <div style="font-weight:700;font-size:14px;color:#191627">${escapeHtml(d.name || 'Repartidor')}</div>
    <div style="font-size:12px;color:#5E5A75;margin-top:1px">${escapeHtml(statusEs)}${ordLabel ? ` · ${escapeHtml(ordLabel)}` : ''}</div>
  </div>`);
  driverInfoWindow.open(map, mk);
}

window.__driversUpdated = () => {
  if (mapReady) renderDrivers();
  if (tab === 'drivers') renderDriversTab();
};

window.__focusDriverOnMap = async (uid) => {
  await window.__onMapaShown();
  if (!mapReady) return;
  clearFocus();
  const d = STORE.drivers[uid];
  if (d && typeof d.lat === 'number' && typeof d.lng === 'number') {
    map.panTo({ lat:d.lat, lng:d.lng }); map.setZoom(15);
    openDriverInfo(uid);
  }
};

// Per-order focus: destination pin + assigned-driver pin + a real road route between them.
// Pickup focuses the restaurant origin (no delivery destination).
window.__focusOrderOnMap = async (orderId) => {
  await window.__onMapaShown();
  if (!mapReady) return;
  clearFocus();
  const dt = STORE.tasks[`${orderId}_delivery`];
  const order = STORE.orders[orderId];
  $('ver-todos')?.classList.remove('hidden');
  if (order?.order_type === 'pickup') {
    const hub = HUBS[order.restaurant_id] || HUBS.x_pizza;
    map.panTo(hub); map.setZoom(15);
    focusLayer.markers.push(new google.maps.Marker({ map, position:hub, label:'R' }));
    return;
  }
  const finite = (v) => typeof v === 'number' && isFinite(v);
  const dest = finite(dt?.destination_lat) ? { lat:dt.destination_lat, lng:dt.destination_lng }
             : (finite(order?.lat) ? { lat:order.lat, lng:order.lng } : null);
  const drvId = dt?.assigned_driver_id; const drv = drvId && STORE.drivers[drvId];
  if (dest) { focusLayer.markers.push(new google.maps.Marker({ map, position:dest, label:'D' })); map.panTo(dest); map.setZoom(15); }
  if (drv && finite(drv.lat)) focusLayer.markers.push(new google.maps.Marker({ map, position:{lat:drv.lat,lng:drv.lng}, opacity: XPD.isStalePing(drv.last_ping)?0.5:1 }));
  if (dest && drv && finite(drv.lat)) {
    if (!dirService) dirService = new google.maps.DirectionsService();
    const renderer = new google.maps.DirectionsRenderer({
      map, suppressMarkers:true, preserveViewport:true,
      polylineOptions: { strokeColor:'#3B82D6', strokeOpacity:0.9, strokeWeight:5 },
    });
    focusLayer.route = renderer;
    dirService.route({ origin: { lat:drv.lat, lng:drv.lng }, destination: dest, travelMode: google.maps.TravelMode.DRIVING },
      (res, status) => {
        if (focusLayer.route !== renderer) { renderer.setMap(null); return; }   // a newer focus superseded us
        if (status === 'OK' && res) renderer.setDirections(res);
        else { renderer.setMap(null); focusLayer.route = null; }                // degrade: no line
      });
  }
};

function clearFocus(){
  focusLayer.markers.forEach(m => m.setMap(null)); focusLayer.markers = [];
  if (focusLayer.line) { focusLayer.line.setMap(null); focusLayer.line = null; }
  if (focusLayer.route) { focusLayer.route.setMap(null); focusLayer.route = null; }
  $('ver-todos')?.classList.add('hidden');
}

$('ver-todos').addEventListener('click', () => { clearFocus(); if (mapReady) { map.setZoom(13); renderDrivers(); } });

renderLive();
</script>
</body>
</html>
