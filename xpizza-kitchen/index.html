<!DOCTYPE html>
<!-- X Pizza Kitchen - version: 2.1.3 -->
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>X Pizza — Cocina</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap"/>
<style>
  /* X Pizza — Kitchen Display
     Reads live order data from Firebase Realtime Database.
     Requires Firebase Auth + kitchen role membership at /kitchen/{uid}.
  */

  :root {
    --black:   #1A1917;
    --char:    #FFFFFF;
    --surface: #F5F5F3;
    --border:  #DDDBD6;
    --cream:   #2A2825;
    --muted:   #6B6860;
    --nuevo:   #B02A14;
    --nuevo-bg:#FDECEA;
    --prep:    #8B6220;
    --prep-bg: #FEF7E8;
    --listo:   #1E6B3A;
    --listo-bg:#E8F5EE;
    --stamp:   'Special Elite', 'Courier New', monospace;
    --body:    'Courier Prime', 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--body);
    background: #EBEBEA;
    color: var(--cream);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: #FFFFFF;
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand {
    font-family: var(--stamp);
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #FFFFFF;
  }

  .brand-sep {
    color: #555555;
    font-size: 18px;
  }

  .brand-sub {
    font-family: var(--stamp);
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #888888;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .clock {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #FFFFFF;
  }

  .refresh-info {
    font-size: 11px;
    color: #888888;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .refresh-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--listo);
    margin-right: 6px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ── Columns layout ── */
  .board {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
    flex: 1;
    overflow: hidden;
    background: #CCCCCC;
  }

  .col {
    display: flex;
    flex-direction: column;
    border-right: 2px solid #CCCCCC;
    overflow: hidden;
    background: #EEEEEE;
  }

  .col:last-child { border-right: none; }

  .col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 2px solid var(--border);
    flex-shrink: 0;
    background: #FFFFFF;
  }

  .col-header.nuevo  { border-top: 4px solid var(--nuevo); }
  .col-header.prep   { border-top: 4px solid var(--prep); }
  .col-header.listo  { border-top: 4px solid var(--listo); }

  .col-title {
    font-family: var(--stamp);
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .col-title.nuevo { color: var(--nuevo); }
  .col-title.prep  { color: var(--prep); }
  .col-title.listo { color: var(--listo); }

  .col-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 24px;
    font-weight: 600;
    color: var(--black);
  }

  .col-body {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .col-body { background: #EEEEEE; }
  .col-body::-webkit-scrollbar { width: 4px; }
  .col-body::-webkit-scrollbar-track { background: transparent; }
  .col-body::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

  /* ── Order cards ── */
  .card.pickup-order {
    border-left: 4px solid #F59E0B;
  }

  .card {
    background: #FFFFFF;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    transition: transform 0.15s, border-color 0.15s;
    user-select: none;
  }

  .card:active { transform: scale(0.98); }
  .card[draggable=true] { cursor: grab; }
  .card[draggable=true]:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; transform: scale(0.97); }
  .col-body.drag-over { background: rgba(0,0,0,0.06); outline: 2px dashed var(--muted); outline-offset: -6px; border-radius: 6px; }

  .card.nuevo { border-left: 3px solid var(--nuevo); }
  .card.prep  { border-left: 3px solid var(--prep); }
  .card.listo { border-left: 3px solid var(--listo); opacity: 0.7; }

  /* ── Cancelled state ── */
  .card.cancelled {
    background: #FFF1F0;
    border: 1px solid var(--nuevo);
    border-left: 6px solid var(--nuevo);
    position: relative;
  }
  /* Cancelled cards keep all order details readable.
     A small red badge in the top-right corner marks the status. */
  .card.cancelled .card-id,
  .card.cancelled .card-customer {
    color: #5F2020;
  }
  .card.cancelled .card-items {
    color: #4A1818;
    opacity: 0.85;
  }
  .card.cancelled .cancelled-badge {
    display: inline-block;
    background: var(--nuevo);
    color: white;
    font-family: var(--stamp);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 3px 8px;
    border-radius: 3px;
    text-transform: uppercase;
    margin-right: 6px;
    vertical-align: middle;
  }
  .card.cancelled .card-footer { display: flex; }
  .card.cancelled .btn-action.btn-archive-cancel {
    flex: 1;
    background: transparent;
    color: var(--nuevo);
    border: 1px solid var(--nuevo);
  }
  .card.cancelled .btn-action.btn-archive-cancel:hover {
    background: var(--nuevo);
    color: white;
  }

  /* ── Cancellation banner ── */
  .cancel-banner {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(-200px);
    background: var(--nuevo);
    color: white;
    padding: 18px 28px;
    border-radius: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: transform 0.35s cubic-bezier(0.18, 1.18, 0.32, 1);
    font-family: var(--stamp);
    letter-spacing: 1px;
    min-width: 320px;
    max-width: 80vw;
  }
  .cancel-banner.shown {
    transform: translateX(-50%) translateY(0);
  }
  .cancel-banner .icon {
    font-size: 32px;
    line-height: 1;
  }
  .cancel-banner .text {
    flex: 1;
    line-height: 1.3;
  }
  .cancel-banner .text strong {
    display: block;
    font-size: 18px;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  .cancel-banner .text .order-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    opacity: 0.85;
    letter-spacing: 0;
  }
  .cancel-banner .dismiss {
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .cancel-banner .dismiss:hover {
    background: rgba(255,255,255,0.32);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }

  .card-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    font-family: 'IBM Plex Sans Condensed', sans-serif;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .card-type-badge.delivery {
    background: #EEF2FF;
    color: #3730A3;
  }
  .card-type-badge.pickup {
    background: #FEF3C7;
    color: #92400E;
  }
  .card-pickup-time {
    background: #FEF3C7;
    color: #92400E;
    font-weight: 600;
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
    display: inline-block;
  }

  .card-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 1px;
    color: var(--muted);
  }

  .card-elapsed {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0;
  }

  .card-elapsed.ok   { background: var(--listo-bg); color: var(--listo); }
  .card-elapsed.warn { background: var(--prep-bg);  color: var(--prep); }
  .card-elapsed.late { background: var(--nuevo-bg); color: var(--nuevo); }

  .card-customer {
    font-family: var(--stamp);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0;
    color: var(--black);
    margin-bottom: 10px;
  }

  .card-items {
    font-size: 16px;
    color: #111111;
    font-family: 'IBM Plex Sans Condensed', sans-serif;
    line-height: 1;
    letter-spacing: 0;
    margin-bottom: 12px;
    border-top: 2px solid var(--border);
    padding-top: 10px;
  }

  .card-item-extra {
    font-size: 14px;
    color: #D97706;
    font-family: 'IBM Plex Sans Condensed', sans-serif;
    font-weight: 600;
    padding: 2px 0 2px 24px;
    line-height: 1.5;
  }
  .card-item-extra-tag {
    font-size: 11px;
    color: #92400E;
    background: rgba(251, 191, 36, 0.18);
    padding: 1px 7px;
    border-radius: 4px;
    margin-left: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    vertical-align: middle;
  }

  .card-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 2px 0;
  }

  .card-item-qty {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: #111111;
    min-width: 36px;
    flex-shrink: 0;
    line-height: 1;
  }

  .card-notes {
    font-size: 14px;
    font-weight: 600;
    color: var(--prep);
    font-style: italic;
    margin-bottom: 10px;
    background: var(--prep-bg);
    padding: 5px 8px;
    border-radius: 3px;
    letter-spacing: 0;
  }

  .card-footer {
    display: flex;
    gap: 8px;
  }

  .btn-action {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 3px;
    font-family: var(--stamp);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn-action:active { transform: scale(0.97); opacity: 0.8; }

  .btn-prep  { background: var(--prep-bg);  color: var(--prep);  border: 1px solid var(--prep); }
  .btn-listo { background: var(--listo-bg); color: var(--listo); border: 1px solid var(--listo); }
  .btn-back  { background: #F5F5F3;          color: var(--muted); border: 1px solid var(--border); flex: 0 0 40px; }
  .btn-done  { background: #E8E6E2;          color: var(--muted); border: 1px solid var(--border); }

  .card-time {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-top: 6px;
    text-align: right;
    font-family: var(--stamp);
  }

  /* ── Empty state ── */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-family: var(--stamp);
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    gap: 8px;
  }

  .empty-icon { font-size: 32px; opacity: 0.3; }

  /* ── Sound & wake lock ── */
  .btn-sound {
    font-family: var(--stamp);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 7px 12px;
    border-radius: 4px;
    border: 1px solid #444444;
    background: transparent;
    color: #AAAAAA;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-sound:hover { background: #333333; color: #FFFFFF; }
  .btn-sound.muted { border-color: #CC4444; color: #CC4444; }
  .wake-indicator {
    font-size: 10px;
    font-family: var(--stamp);
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #3A8A52;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .wake-indicator.inactive { color: #CC4444; }

  /* ── Archive toggle button ── */
  .btn-archive-toggle {
    font-family: var(--stamp);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 7px 14px;
    border-radius: 4px;
    border: 1px solid #444444;
    background: transparent;
    color: #AAAAAA;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-archive-toggle:hover { background: #333333; color: #FFFFFF; }
  .btn-archive-toggle.active { background: #FFFFFF; color: var(--black); border-color: #FFFFFF; }

  /* ── Archive drawer ── */
  .archive-drawer {
    display: none;
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 42vh;
    background: #fff;
    border-top: 2px solid var(--black);
    z-index: 1000;
    flex-direction: column;
  }
  .archive-drawer.open { display: flex; }
  .archive-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: #F4F4F4;
    flex-shrink: 0;
  }
  .archive-title {
    font-family: var(--stamp);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--black);
  }
  .archive-body {
    display: flex;
    gap: 10px;
    padding: 12px;
    overflow-x: auto;
    flex: 1;
    align-items: flex-start;
  }
  .archive-body::-webkit-scrollbar { height: 4px; }
  .archive-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .archive-card {
    min-width: 220px;
    max-width: 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--muted);
    border-radius: 8px;
    padding: 12px;
    flex-shrink: 0;
  }
  .archive-card-id {
    font-family: var(--stamp);
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .archive-card-name {
    font-family: var(--stamp);
    font-size: 15px;
    color: var(--black);
    margin-bottom: 6px;
  }
  .archive-card-items {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 10px;
  }
  .archive-log {
    margin: 8px 0;
    padding: 8px;
    background: var(--surface);
    border-radius: 6px;
    border: 1px solid var(--border);
  }
  .archive-log-title {
    font-family: var(--stamp);
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .archive-log .log-row {
    padding: 4px 0;
    font-size: 11px;
  }
  .archive-log .log-status { font-family: var(--stamp); color: var(--black); letter-spacing: 0.5px; }
  .archive-log .log-time   { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size:11px; white-space:nowrap; }
  .btn-restore {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--nuevo);
    background: var(--nuevo-bg);
    color: var(--nuevo);
    border-radius: 6px;
    font-family: var(--stamp);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .archive-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    font-family: var(--stamp);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── Log button ── */
  .btn-log {
    display: block;
    margin-top: 8px;
    width: 100%;
    padding: 5px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 4px;
    font-family: var(--stamp);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--muted);
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-log:hover { background: var(--surface); }

  /* ── Shorten status for log display ── */
function shortStatus(s) {
  if (s === 'En preparación') return 'En prep.';
  return s;
}

/* ── Log modal ── */
  .log-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  .log-overlay.open { display: flex; }
  .log-modal {
    background: #fff;
    border-radius: 12px;
    padding: 24px;
    min-width: 320px;
    max-width: 420px;
    width: 90%;
  }
  .log-modal-title {
    font-family: var(--stamp);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--black);
    margin-bottom: 16px;
    border-bottom: 2px solid var(--black);
    padding-bottom: 10px;
  }
  .log-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 0;
    border-bottom: 1px solid var(--surface);
    font-size: 13px;
    gap: 12px;
  }
  .log-row:last-child { border-bottom: none; }
  .log-status { font-family: var(--stamp); color: var(--black); letter-spacing: 1px; }
  .log-time { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size:12px; white-space:nowrap; }
  .btn-close-log {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    background: var(--black);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: var(--stamp);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
  }

  /* ── Loading ── */
  .loading {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-family: var(--stamp);
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--black);
  }
  /* ── Login screen ── */
  .login-screen {
    position: fixed;
    inset: 0;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    z-index: 9999;
  }
  .login-screen.hidden { display: none; }
  .login-brand {
    font-family: var(--stamp);
    font-size: 32px;
    letter-spacing: 4px;
  }
  .login-brand-sub {
    font-family: var(--body);
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: -16px;
  }
  .login-form {
    background: #FFFFFF;
    border: 1px solid var(--border);
    padding: 28px 24px;
    width: 320px;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .login-form h2 {
    font-family: var(--stamp);
    font-size: 18px;
    letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .login-form p {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .login-form input {
    font-family: var(--body);
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--cream);
  }
  .login-form input:focus { outline: 2px solid var(--cream); border-color: var(--cream); }
  .login-form button {
    font-family: var(--stamp);
    font-size: 14px;
    letter-spacing: 2px;
    padding: 10px;
    background: var(--cream);
    color: white;
    border: none;
    cursor: pointer;
  }
  .login-form button:disabled { opacity: 0.5; cursor: wait; }
  .login-error {
    color: var(--nuevo);
    font-size: 12px;
    text-align: center;
    min-height: 16px;
  }
  .signout-btn {
    font-family: var(--body);
    font-size: 11px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
    padding: 4px 8px;
    margin-left: 8px;
    cursor: pointer;
  }
  .signout-btn:hover { color: var(--cream); border-color: var(--cream); }
</style>
</head>
<body>

<div class="header">

      🔔 Sonido ON

<div class="board">

      <div class="loading">Cargando…</div>

  <div class="col">

<script type="module">
// X Pizza Kitchen Display
// version: 2.1.3
//
// Major rewrite from the original Sheets-polling design:
//   - Reads orders directly from Firebase Realtime Database (live subscription)
//   - Requires Firebase Auth + kitchen role membership at /kitchen/{uid}
//   - Status changes here propagate to /orders/{id}/status (visible to dispatcher,
//     customer tracking page, etc.)
//   - No API keys hardcoded in the page

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js';
import * as XPD from './xpizza-delivery.js?v=16';

// Same Firebase project config as driver/dispatch.
// apiKey is NOT a secret — it identifies the project. Real access is gated
// by Firebase Auth + Firebase Realtime Database rules.
const firebaseConfig = {
  apiKey: "AIzaSyDWFYrzHvaNnRZERbN8jIuAzkY85daFJXU",
  authDomain: "xpizza-delivery.firebaseapp.com",
  databaseURL: "https://xpizza-delivery-default-rtdb.firebaseio.com",
  projectId: "xpizza-delivery",
  messagingSenderId: "185867271616",
  appId: "1:185867271616:web:84bb37552b40c1d517dc25"
};

XPD.initDelivery(firebaseConfig);

// Make these available to the inline onclick handlers in the existing markup
// (the original kitchen used <script> not module, so handlers reference globals).
window.XPD = XPD;

/* ═══════════════════════════════════════════════
   CONFIGURATION
   ═══════════════════════════════════════════════
   Kitchen display reads orders directly from Firebase
   (subscribes to /orders for real-time updates).
   No API keys are embedded in the page — access is gated
   by Firebase Auth + the kitchen role at /kitchen/{uid}.
*/
/* ─────────────────────────────────────────────── */

// In-memory state: tracks status changes made on this tablet
// Key: order_id, Value: 'Nuevo' | 'En preparación' | 'Listo' | 'Archivado'
const localState = JSON.parse(localStorage.getItem('xpizza_orders') || '{}');
// Track when each order was moved to each status (for elapsed time logging)
const stateLog   = JSON.parse(localStorage.getItem('xpizza_log')    || '{}');

// Escape HTML-significant chars before interpolating untrusted order data
// (customer name, items, notes — originate from the public order form) into
// innerHTML. Defense-in-depth against stored XSS into the kitchen display.
function escapeHtml(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function saveState() {
  localStorage.setItem('xpizza_orders', JSON.stringify(localState));
  localStorage.setItem('xpizza_log',    JSON.stringify(stateLog));
}

/* ── Clock ── */
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
setInterval(updateClock, 1000);
updateClock();

/* ── Elapsed time ── */
function elapsed(isoTimestamp) {
  const diff = Math.floor((Date.now() - new Date(isoTimestamp)) / 1000);
  const m = Math.floor(diff / 60);
  const s = diff % 60;
  return m > 0 ? `${m}m ${s}s` : `${s}s`;
}

function elapsedClass(isoTimestamp) {
  const mins = (Date.now() - new Date(isoTimestamp)) / 60000;
  if (mins < 15) return 'ok';
  if (mins < 25) return 'warn';
  return 'late';
}

function formatTime(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit' });
}

/* ── Parse items from items_text ── */
function parseItems(itemsText) {
  if (!itemsText || itemsText === '—') return [];
  // Split by | separator between pizza items
  return itemsText.split(' | ').map(s => s.trim()).filter(Boolean);
}

function renderItems(itemsText) {
  if (!itemsText || itemsText === '—') return '';
  // Split pizza items by ' | ' but NOT when inside brackets []
  const pizzas = [];
  let depth = 0, cur = '';
  for (let i = 0; i < itemsText.length; i++) {
    const c = itemsText[i];
    if (c === '[') depth++;
    else if (c === ']') depth--;
    if (depth === 0 && itemsText.slice(i, i+3) === ' | ') {
      pizzas.push(cur.trim());
      cur = '';
      i += 2;
    } else {
      cur += c;
    }
  }
  if (cur.trim()) pizzas.push(cur.trim());

  return pizzas.map(pizza => {
    // Match: Qty, Name, optional (Lprice), optional [extras]
    const m = pizza.match(/^(\d+)x\s+(.+?)(?:\s+\(L[\d.]+\))?(?:\s+\[(.+)\])?$/);
    if (!m) return `<div class="card-item"><span>${escapeHtml(pizza)}</span></div>`;

    const qty = parseInt(m[1], 10);
    const name = escapeHtml(m[2]);
    const extrasRaw = m[3] ? escapeHtml(m[3]) : m[3];

    let extrasHtml = '';
    if (extrasRaw) {
      // CASE A: extras have "Pizza N:" prefix (means qty was >1 in the form
      // OR this is per-instance data). Need careful handling so cook can tell
      // which specific pizza gets which extras.
      if (extrasRaw.includes('Pizza ')) {
        const perPizza = extrasRaw.split(/\s*\|\s*(?=Pizza \d)/);

        // Only safe to strip "Pizza N:" prefix when there's a single pizza
        // total (qty===1). When qty>1, the prefix carries critical info
        // about WHICH instance gets the extras — even if only one entry
        // exists in the bracket. Stripping it would let the cook think
        // ALL pizzas of this type get the extra, when really only one does.
        if (qty === 1) {
          // Single pizza, single extras line — strip the redundant prefix
          const stripped = perPizza[0].replace(/^Pizza \d+:\s*/, '');
          extrasHtml = `<div class="card-item-extra">↳ ${stripped.trim()}</div>`;
        } else {
          // Multiple pizzas. Detect if every pizza has the same extras —
          // in that case we collapse to a single "all" line instead of
          // showing identical lines per pizza, which is noisy and hides
          // the fact that they're all the same.
          const allHaveExtras = perPizza.length === qty;
          const allSame = allHaveExtras && perPizza.every((p, i, arr) => {
            const stripA = p.replace(/^Pizza \d+:\s*/, '').trim();
            const stripB = arr[0].replace(/^Pizza \d+:\s*/, '').trim();
            return stripA === stripB;
          });

          if (allSame) {
            const sharedExtras = perPizza[0].replace(/^Pizza \d+:\s*/, '').trim();
            extrasHtml = `<div class="card-item-extra">↳ ${sharedExtras} <span class="card-item-extra-tag">(todas)</span></div>`;
          } else {
            extrasHtml = perPizza.map(p =>
              `<div class="card-item-extra">↳ ${p.trim()}</div>`
            ).join('');
          }
        }
      } else {
        // CASE B: no "Pizza N:" prefix at all — this is the qty=1 case where
        // the order form didn't bother adding the prefix. Just show the extras.
        extrasHtml = `<div class="card-item-extra">↳ ${extrasRaw}</div>`;
      }
    }

    return `<div class="card-item"><span class="card-item-qty">${qty}×</span><span>${name}</span></div>${extrasHtml}`;
  }).join('');
}

/* ── Render a single card ── */
function renderCard(order) {
  const status  = localState[order.id] || order.estado || 'Nuevo';
  const created = order.hora;
  const items   = parseItems(order.pedido);
  const notes   = order.notas && order.notas !== '—' ? order.notas : null;

  // Cancelled state: render struck-through with a CANCELADO stamp.
  // Cancellation is a SHEET-driven status (set by the backend when
  // dispatcher cancels), so localState shouldn't override it. We only
  // honour localState if it's NOT 'Cancelado' — sheet wins for cancels.
  const isCancelled = order.estado === 'Cancelado';

  const statusClass = isCancelled ? 'cancelled'
                    : status === 'Nuevo' ? 'nuevo'
                    : status === 'En preparación' ? 'prep'
                    : 'listo';

  // Log timestamps for each status transition
  const log = stateLog[order.id] || {};
  const logStr = Object.entries(log)
    .map(([s, t]) => `${s}: ${formatTime(t)}`)
    .join(' · ');

  let buttons = '';
  if (isCancelled) {
    // Cancelled cards get an Archive button so the cook can clear them
    // once they've acknowledged. Archiving uses the same localState
    // mechanism as Listo → Archivado, so it persists in localStorage.
    buttons = `<button class="btn-action btn-archive-cancel" onclick="moveOrder('${order.id}', 'Archivado')">Archivar</button>`;
  } else if (status === 'Nuevo') {
    buttons = `<button class="btn-action btn-prep" onclick="moveOrder('${order.id}', 'En preparación')">En preparación →</button>`;
  } else if (status === 'En preparación') {
    buttons = `
      <button class="btn-action btn-back" onclick="moveOrder('${order.id}', 'Nuevo')">←</button>
      <button class="btn-action btn-listo" onclick="moveOrder('${order.id}', 'Listo')">Listo ✓</button>`;
  } else if (status === 'Listo') {
    buttons = `
      <button class="btn-action btn-back" onclick="moveOrder('${order.id}', 'En preparación')">←</button>
      <button class="btn-action btn-done" onclick="moveOrder('${order.id}', 'Archivado')">Archivar</button>`;
  }

  return `
    <div class="card ${statusClass}${order.order_type === 'pickup' ? ' pickup-order' : ''}" id="card-${order.id}"
      ${isCancelled ? '' : 'draggable="true"'}
      ${isCancelled ? '' : `ondragstart="dragStart(event, '${order.id}')" ondragend="dragEnd(event)"`}>
      <div class="card-top">
        <div class="card-id">${isCancelled ? '<span class="cancelled-badge">Cancelado</span>' : ''}${order.orden || order.id}</div>
        <div class="card-elapsed ${elapsedClass(created)}" id="elapsed-${order.id}">${elapsed(created)}</div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div class="card-customer">${escapeHtml(order.cliente)}</div>
        <div class="card-type-badge ${order.order_type === "pickup" ? "pickup" : "delivery"}">${order.order_type === "pickup" ? "🏪 Pickup" : "🛵 Delivery"}</div>
      </div>
      ${order.order_type === 'pickup' && order.pickup_time && order.pickup_time !== 'standard' ? `<div class="card-pickup-time">⏰ ${escapeHtml(order.pickup_time)}</div>` : ''}

      <div class="card-items">
        ${renderItems(order.pedido)}
      </div>
      ${notes ? `<div class="card-notes">⚠ ${escapeHtml(notes)}</div>` : ''}
      <div class="card-footer">${buttons}</div>
      ${logStr && !isCancelled ? `<button class="btn-log" onclick="showLog(event, '${order.id}')">· · ·</button>` : ''}
    </div>`;
}

/* ── Move order to new status ──
   Updates local state immediately for snappy UI, then propagates
   the change to Firebase so dispatcher + customer (via tracking page)
   see it. The local-only "Archivado" status stays out of Firebase —
   it's a kitchen-display convention for hiding things from view, not
   a real order state. */
const KDS_TO_ORDER_STATUS = {
  'Nuevo': 'new',
  'En preparación': 'preparing',
  'Listo': 'ready'
  // 'Archivado' — local only, no Firebase write
};

function moveOrder(id, newStatus) {
  localState[id] = newStatus;
  if (!stateLog[id]) stateLog[id] = {};
  stateLog[id][newStatus] = new Date().toISOString();
  saveState();

  // Propagate to Firebase if it's a real order status (not "Archivado")
  const fbStatus = KDS_TO_ORDER_STATUS[newStatus];
  if (fbStatus) {
    XPD.setOrderStatus(id, fbStatus).catch(e => {
      console.warn('Failed to propagate status to Firebase:', e.message);
    });
  }

  const activeOrders = allOrders.filter(o => (localState[o.id] || o.estado) !== 'Archivado');
  render(activeOrders);
}

/* ── Render all columns ── */
let lastOrders = [];
let allOrders = [];

function render(orders) {
  lastOrders = orders;
  // Sync allOrders with any new orders not yet in it
  orders.forEach(o => {
    if (!allOrders.find(a => a.id === o.id)) allOrders.push(o);
  });

  // Cancelled orders stay visible in whichever column they were in
  // (kitchen needs to see them to STOP cooking). The "effective status"
  // for column placement is localState IF the order isn't cancelled,
  // otherwise the localState that was set before cancellation, otherwise Nuevo.
  function effectiveStatus(o) {
    if (o.estado === 'Cancelado') {
      // Use whatever local status the kitchen had set, or Nuevo if none
      return localState[o.id] || 'Nuevo';
    }
    return localState[o.id] || o.estado || 'Nuevo';
  }

  const nuevo = orders.filter(o => effectiveStatus(o) === 'Nuevo');
  const prep  = orders.filter(o => effectiveStatus(o) === 'En preparación');
  const listo = orders.filter(o => effectiveStatus(o) === 'Listo');

  document.getElementById('count-nuevo').textContent = nuevo.length;
  document.getElementById('count-prep').textContent  = prep.length;
  document.getElementById('count-listo').textContent = listo.length;

  const colNuevo = document.getElementById('col-nuevo');
  const colPrep  = document.getElementById('col-prep');
  const colListo = document.getElementById('col-listo');

  colNuevo.innerHTML = nuevo.length ? nuevo.map(renderCard).join('') : '<div class="empty"><div class="empty-icon">✓</div>Sin pedidos nuevos</div>';
  colPrep.innerHTML  = prep.length  ? prep.map(renderCard).join('')  : '<div class="empty"><div class="empty-icon">·</div>Nada en preparación</div>';
  colListo.innerHTML = listo.length ? listo.map(renderCard).join('') : '<div class="empty"><div class="empty-icon">·</div>Nada listo aún</div>';

  // Render archived
  const archived = allOrders.filter(o => (localState[o.id] || o.estado) === 'Archivado');
  document.getElementById('archive-count').textContent = archived.length;
  document.getElementById('history-count').textContent = allOrders.length;
  const archiveBody = document.getElementById('archive-body');
  if (archiveBody) {
    archiveBody.innerHTML = archived.length
      ? archived.map(o => {
          const log = stateLog[o.id] || {};
          const logEntries = Object.entries(log);
          const logHtml = logEntries.length
            ? logEntries.map(([status, time]) => `
                <div class="log-row">
                  <span class="log-status">${shortStatus(status)}</span>
                  <span class="log-time">${new Date(time).toLocaleTimeString('es-HN', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</span>
                </div>`).join('')
            : '<div style="color:var(--muted);font-size:11px;padding:4px 0">Sin historial.</div>';
          return `
          <div class="archive-card">
            <div class="archive-card-id">${o.orden || o.id}</div>
            <div class="archive-card-name">${escapeHtml(o.cliente)}</div>
            <div class="archive-card-items">${escapeHtml(o.pedido)}</div>
            <div class="archive-log">
              <div class="archive-log-title">Historial</div>
              ${logHtml}
            </div>
            <button class="btn-restore" onclick="restoreOrder('${o.id}')">↩ Restaurar</button>
          </div>`;
        }).join('')
      : '<div class="archive-empty">Sin pedidos archivados</div>';
  }
}

/* ── Update elapsed timers every second without full re-render ── */
function tickElapsed() {
  lastOrders.forEach(o => {
    const el = document.getElementById('elapsed-' + o.id);
    if (el) {
      el.textContent  = elapsed(o.hora);
      el.className    = 'card-elapsed ' + elapsedClass(o.hora);
    }
  });
}
setInterval(tickElapsed, 1000);

/* ── Subscribe to orders from Firebase ─────────────
   Replaces the old Google Sheets polling. Subscribes once,
   the callback fires whenever any order changes (real-time).
   Filters to active orders that haven't been delivered/cancelled.
   Maps Firebase order shape to the kitchen card shape. */
let firebaseUnsubscribe = null;

function startOrdersSubscription() {
  if (firebaseUnsubscribe) firebaseUnsubscribe();
  firebaseUnsubscribe = XPD.subscribeToOrders((ordersById) => {
    // ordersById: { orderId1: {...}, orderId2: {...}, ... }
    const orders = Object.values(ordersById || {})
      // Map Firebase order shape -> kitchen card shape.
      .map(o => mapFirebaseOrderToCard(o))
      .filter(o => o !== null)
      // Most recent first
      .sort((a, b) => {
        const ta = a.hora ? new Date(a.hora).getTime() : 0;
        const tb = b.hora ? new Date(b.hora).getTime() : 0;
        return tb - ta;
      });

    // Reconcile localState with Firebase truth: if the system reports an
    // order as Archivado (i.e., delivered or otherwise terminal), clear any
    // stale localState for that order so the system status wins. Without
    // this, a cook who moved a card to Listo earlier would keep seeing it
    // in Listo even after the driver completes the delivery, because
    // localState would shadow the fresh estado.
    let stateChanged = false;
    orders.forEach(o => {
      if (o.estado === 'Archivado' && localState[o.id] && localState[o.id] !== 'Archivado') {
        delete localState[o.id];
        stateChanged = true;
      }
    });
    if (stateChanged) saveState();

    allOrders = orders;
    // Hide orders the kitchen has archived locally OR that the system has
    // marked delivered (those don't belong in the active kitchen view —
    // they go to the archive panel instead).
    const activeOrders = orders.filter(o => {
      const localStatus = localState[o.id] || o.estado;
      if (localStatus === 'Archivado') return false;
      return true;
    });
    render(activeOrders);
    checkForNewOrders(activeOrders);
  });
}

/* Map a Firebase /orders/{id} record to the shape the kitchen UI expects.
   The kitchen was originally built around a Google Sheets row layout, so we
   keep that shape (id, hora, orden, cliente, ...) and translate Firebase
   field names. The order.status from /orders maps to KDS estado:
     'new'              → 'Nuevo'
     'preparing'        → 'En preparación'
     'ready'            → 'Listo'
     'out_for_delivery' → kitchen's job is done, treat as 'Listo' for display
     'delivered'        → 'Archivado' (auto-archived; visible only in archive/history views)
     'cancelled'        → 'Nuevo' with cancel banner so kitchen sees it
*/
function mapFirebaseOrderToCard(o) {
  if (!o) return null;

  // HARD GUARD: a payment-pending / unpaid order must NEVER become a kitchen ticket.
  // Online orders are written as status:'pending_payment' and only flip to 'new' after
  // the payment is captured + confirmed; a declined/abandoned one STAYS 'pending_payment'.
  // subscribeToOrders already filters these, but we guard here too (defense-in-depth in
  // case a stale cached SDK without the filter is ever served). The catch-all below maps
  // unknown statuses to 'Nuevo', so without this an unpaid order shows as NUEVO.
  if (o.status === 'pending_payment') return null;

  let estado;
  if (o.status === 'cancelled') {
    // Mark as Cancelado so downstream code fires:
    // - Banner + cancel sound (checkForNewOrders)
    // - Column placement preservation (effectiveStatus uses localState when
    //   estado is Cancelado, so a card mid-prep stays in its column)
    // - Cancelled card styling (renderCard isCancelled check)
    estado = 'Cancelado';
  } else if (o.status === 'delivered') {
    // Delivered orders flow into the archive automatically. They don't appear
    // in active columns (filter elsewhere drops Archivado from active view)
    // but they DO show up in "Ver archivados" and "Historial completo" so
    // the cook can verify what was delivered today / look back at the day's
    // record. Previously these orders were null-filtered and disappeared
    // entirely once the driver marked them delivered, which felt like data loss.
    estado = 'Archivado';
  } else if (o.status === 'preparing') {
    estado = 'En preparación';
  } else if (o.status === 'ready' || o.status === 'out_for_delivery') {
    estado = 'Listo';
  } else {
    estado = 'Nuevo';
  }

  // Format created_at (ms epoch) as ISO so the existing elapsed() helper works
  const horaIso = o.created_at ? new Date(o.created_at).toISOString() : null;

  return {
    id: o.order_id,
    hora: horaIso,
    orden: o.order_id,
    cliente: o.customer_name || '—',
    telefono: o.customer_phone || '',
    pedido: o.items_text || '',
    total: o.total != null ? `L${o.total}` : '',
    maps: o.maps_link || '',
    notas: o.notes || '—',
    estado: estado,
    order_type: o.order_type || 'delivery',
    pickup_time: o.pickup_time || null,
    cancelled: o.status === 'cancelled'
  };
}

/* ── Shorten status for log display ── */
function shortStatus(s) {
  if (s === 'En preparación') return 'En prep.';
  return s;
}

/* ── Log modal ── */
function showLog(event, id) {
  event.stopPropagation();
  const log = stateLog[id] || {};
  const order = allOrders.find(o => o.id === id) || lastOrders.find(o => o.id === id);
  const title = order ? `${order.orden} · ${order.cliente}` : id;
  document.getElementById('log-modal-title').textContent = title;
  const entries = Object.entries(log);
  document.getElementById('log-modal-body').innerHTML = entries.length
    ? entries.map(([status, time]) => `
        <div class="log-row">
          <span class="log-status">${shortStatus(status)}</span>
          <span class="log-time">${new Date(time).toLocaleTimeString('es-HN', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</span>
        </div>`).join('')
    : '<div style="color:var(--muted);font-size:13px;padding:8px 0">Sin historial disponible.</div>';
  document.getElementById('log-overlay').classList.add('open');
}

function closeLog(event) {
  if (event && event.target !== document.getElementById('log-overlay')) return;
  document.getElementById('log-overlay').classList.remove('open');
}

/* ── Archive ── */
let archiveOpen = false;

function toggleArchive() {
  archiveOpen = !archiveOpen;
  document.getElementById('archive-drawer').classList.toggle('open', archiveOpen);
  document.getElementById('btn-archive-toggle').classList.toggle('active', archiveOpen);
  // Close history if open
  historyOpen = false;
  document.getElementById('history-drawer').classList.remove('open');
  document.getElementById('btn-history-toggle').classList.remove('active');
}

let historyOpen = false;

function toggleHistory() {
  historyOpen = !historyOpen;
  document.getElementById('history-drawer').classList.toggle('open', historyOpen);
  document.getElementById('btn-history-toggle').classList.toggle('active', historyOpen);
  // Close archive if open
  archiveOpen = false;
  document.getElementById('archive-drawer').classList.remove('open');
  document.getElementById('btn-archive-toggle').classList.remove('active');
  if (historyOpen) renderHistory();
}

function renderHistory() {
  const body = document.getElementById('history-body');
  if (!body) return;
  const sorted = [...allOrders].reverse();
  body.innerHTML = sorted.length ? sorted.map(o => {
    const status = localState[o.id] || o.estado || 'Nuevo';
    const log = stateLog[o.id] || {};
    const logEntries = Object.entries(log);
    const statusColor = status === 'Nuevo' ? 'var(--nuevo)'
                      : status === 'En preparación' ? 'var(--prep)'
                      : status === 'Listo' ? 'var(--listo)'
                      : 'var(--muted)';
    const logHtml = logEntries.length
      ? logEntries.map(([s, t]) => `
          <div class="log-row">
            <span class="log-status">${shortStatus(s)}</span>
            <span class="log-time">${new Date(t).toLocaleTimeString('es-HN', {hour:'2-digit', minute:'2-digit', second:'2-digit'})}</span>
          </div>`).join('')
      : '<div style="color:var(--muted);font-size:11px;padding:4px 0">Sin movimientos.</div>';
    return `
      <div class="archive-card" style="border-left-color:${statusColor}">
        <div class="archive-card-id">${o.orden || o.id}</div>
        <div class="archive-card-name">${escapeHtml(o.cliente)}</div>
        <div style="font-size:10px;font-family:var(--stamp);letter-spacing:1px;color:${statusColor};margin-bottom:6px;text-transform:uppercase">${status}</div>
        <div class="archive-card-items">${escapeHtml(o.pedido)}</div>
        <div class="archive-log">
          <div class="archive-log-title">Historial</div>
          ${logHtml}
        </div>
        ${status === 'Archivado'
          ? `<button class="btn-restore" onclick="restoreOrder('${o.id}')">↩ Restaurar</button>`
          : ''}
      </div>`;
  }).join('') : '<div class="archive-empty">Sin pedidos registrados aún.</div>';
}

function restoreOrder(id) {
  localState[id] = 'Nuevo';
  if (stateLog[id]) {
    stateLog[id]['Restaurado'] = new Date().toISOString();
  }
  saveState();
  const activeOrders = allOrders.filter(o => (localState[o.id] || o.estado) !== 'Archivado');
  render(activeOrders);
}

/* ── Drag and Drop ── */
let draggedId = null;

function dragStart(event, id) {
  draggedId = id;
  setTimeout(() => {
    const el = document.getElementById('card-' + id);
    if (el) el.classList.add('dragging');
  }, 0);
  event.dataTransfer.effectAllowed = 'move';
}

function dragEnd(event) {
  if (draggedId) {
    const el = document.getElementById('card-' + draggedId);
    if (el) el.classList.remove('dragging');
  }
  document.querySelectorAll('.col-body').forEach(col => col.classList.remove('drag-over'));
}

function dragOver(event) {
  event.preventDefault();
  event.dataTransfer.dropEffect = 'move';
  event.currentTarget.classList.add('drag-over');
}

function dragLeave(event) {
  event.currentTarget.classList.remove('drag-over');
}

function drop(event, newStatus) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  if (draggedId) {
    moveOrder(draggedId, newStatus);
    draggedId = null;
  }
}

/* ── Touch drag support for tablets ── */
let touchDragId = null;
let touchClone  = null;

document.addEventListener('touchstart', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  touchDragId = card.id.replace('card-', '');
  // Create visual clone
  touchClone = card.cloneNode(true);
  touchClone.style.cssText = `position:fixed;width:${card.offsetWidth}px;opacity:0.85;pointer-events:none;z-index:9999;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.2);`;
  document.body.appendChild(touchClone);
  card.classList.add('dragging');
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!touchDragId || !touchClone) return;
  const t = e.touches[0];
  touchClone.style.left = (t.clientX - touchClone.offsetWidth / 2) + 'px';
  touchClone.style.top  = (t.clientY - 40) + 'px';
  // Highlight column under finger
  document.querySelectorAll('.col-body').forEach(col => col.classList.remove('drag-over'));
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const col = el && el.closest('.col-body');
  if (col) col.classList.add('drag-over');
}, { passive: true });

document.addEventListener('touchend', e => {
  if (!touchDragId) return;
  const t = e.changedTouches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  const col = el && el.closest('.col-body');
  document.querySelectorAll('.col-body').forEach(c => c.classList.remove('drag-over'));
  if (touchClone) { touchClone.remove(); touchClone = null; }
  const card = document.getElementById('card-' + touchDragId);
  if (card) card.classList.remove('dragging');
  if (col) {
    const status = col.id === 'col-nuevo' ? 'Nuevo'
                 : col.id === 'col-prep'  ? 'En preparación'
                 : 'Listo';
    moveOrder(touchDragId, status);
  }
  touchDragId = null;
});

/* ── Sound alert ── */
let soundEnabled = true;
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playChime() {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
    notes.forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.15);
      gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.15);
      gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + i * 0.15 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.4);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.4);
    });
  } catch(e) { console.warn('Sound error:', e); }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('btn-sound');
  btn.textContent = soundEnabled ? '🔔 Sonido ON' : '🔕 Sonido OFF';
  btn.classList.toggle('muted', !soundEnabled);
  if (soundEnabled) {
    // Unlock audio context on user interaction
    try { getAudioCtx().resume(); } catch(e) {}
    playChime();
  }
}

// Track known order IDs to detect new arrivals
let knownOrderIds = new Set();
let firstLoad = true;

// Track which order IDs we've already alerted about as cancelled
// (so re-renders don't keep firing the chime + banner)
let alertedCancellations = new Set();



function checkForNewOrders(orders) {
  if (firstLoad) {
    // On first load, just populate known IDs without alerting
    orders.forEach(o => {
      knownOrderIds.add(o.id);
      // Suppress "this is a new cancellation!" chime for orders that
      // were already cancelled before the KDS opened
      if (o.estado === 'Cancelado') alertedCancellations.add(o.id);
    });
    firstLoad = false;
    return;
  }
  const newOnes = orders.filter(o => !knownOrderIds.has(o.id));
  newOnes.forEach(o => knownOrderIds.add(o.id));
  if (newOnes.length > 0) playChime();

  // Detect cancellations: orders where estado is 'Cancelado' and we
  // haven't alerted on them yet. Fires once per cancelled order.
  const newCancellations = orders.filter(o =>
    o.estado === 'Cancelado' && !alertedCancellations.has(o.id)
  );
  newCancellations.forEach(o => {
    alertedCancellations.add(o.id);
    showCancelBanner(o);
    playCancelAlert();
  });
}

/* ── Cancellation alert ──
   Distinct sound from the new-order chime — descending minor pattern
   (G5 → Eb5 → C5), played twice, instead of the ascending major chime.
   Sounds urgent rather than welcoming.

   Mirrors the playChime() structure exactly (sine waves, single forEach,
   no advance scheduling > 1s) since that pattern is proven to work
   reliably on iOS Safari. Defensive ctx.resume() handles the case where
   the audio context was suspended (browser hasn't received user
   interaction yet — though if the new-order chime plays, audio is
   already unlocked). */
function playCancelAlert() {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx();
    // Defensive: try to resume in case context was suspended.
    // No-op if already running. Returns a promise we don't await
    // (we still schedule notes synchronously).
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    playCancelPass(ctx, 0);
    // Second pass after first finishes (~0.55s of notes + small gap)
    setTimeout(() => {
      try { playCancelPass(getAudioCtx(), 0); } catch(e) {}
    }, 700);
  } catch(e) { console.warn('Cancel alert error:', e); }
}

// One pass of the descending pattern. Same envelope shape as playChime:
// each note is short (~0.4s) with overlapping starts (0.18s spacing)
// for a fluid descending arpeggio feel.
function playCancelPass(ctx, baseDelay) {
  const notes = [783.99, 622.25, 523.25]; // G5, Eb5, C5
  notes.forEach((freq, i) => {
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    const t = ctx.currentTime + baseDelay + i * 0.18;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.45, t + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.start(t);
    osc.stop(t + 0.4);
  });
}

/* ── Cancellation banner ── */
let cancelBannerTimer = null;
function showCancelBanner(order) {
  const banner = document.getElementById('cancel-banner');
  const idEl   = document.getElementById('cancel-banner-id');
  if (!banner || !idEl) return;

  idEl.textContent = `${order.orden || order.id} · ${order.cliente || ''}`;
  banner.classList.add('shown');

  // Auto-dismiss after 12 seconds (kitchen has time to read it)
  if (cancelBannerTimer) clearTimeout(cancelBannerTimer);
  cancelBannerTimer = setTimeout(() => {
    banner.classList.remove('shown');
  }, 12000);
}

document.addEventListener('DOMContentLoaded', () => {
  const dismiss = document.getElementById('cancel-banner-dismiss');
  if (dismiss) {
    dismiss.addEventListener('click', () => {
      document.getElementById('cancel-banner').classList.remove('shown');
      if (cancelBannerTimer) clearTimeout(cancelBannerTimer);
    });
  }
});

/* ── Screen wake lock ── */
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      document.getElementById('wake-indicator').textContent = '⬤ Pantalla activa';
      document.getElementById('wake-indicator').classList.remove('inactive');
      wakeLock.addEventListener('release', () => {
        document.getElementById('wake-indicator').textContent = '⬤ Pantalla inactiva';
        document.getElementById('wake-indicator').classList.add('inactive');
      });
    }
  } catch(e) {
    console.warn('Wake lock error:', e);
    document.getElementById('wake-indicator').textContent = '⬤ No soportado';
    document.getElementById('wake-indicator').classList.add('inactive');
  }
}

// Re-request wake lock when tab becomes visible again
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && (!wakeLock || wakeLock.released)) {
    await requestWakeLock();
  }
});

/* ── Auto-refresh ── */
requestWakeLock();

/* ── Expose inline-handler functions to window ──
   Original kitchen used <script> (global scope); converting to <script type=module>
   loses that auto-globalization, so we attach the functions onclick attributes
   reference back to window explicitly. */
window.toggleSound = toggleSound;
window.toggleArchive = toggleArchive;
window.toggleHistory = toggleHistory;
window.moveOrder = moveOrder;
window.restoreOrder = restoreOrder;
window.showLog = showLog;
window.closeLog = closeLog;
window.dragStart = dragStart;
window.dragEnd = dragEnd;
window.dragOver = dragOver;
window.dragLeave = dragLeave;
window.drop = drop;

/* ── Auth boot ──
   Wait for Firebase Auth state. If signed in + has kitchen role, start the
   subscription. Otherwise show the login screen.
*/
const $login = document.getElementById('login-screen');
const $loginBtn = document.getElementById('login-btn');
const $loginEmail = document.getElementById('login-email');
const $loginPassword = document.getElementById('login-password');
const $loginError = document.getElementById('login-error');
const $signoutBtn = document.getElementById('signout-btn');

function showLogin() {
  $login.classList.remove('hidden');
}
function hideLogin() {
  $login.classList.add('hidden');
}
function setLoginError(msg) {
  $loginError.textContent = msg || '';
}

$loginBtn.addEventListener('click', async () => {
  const email = $loginEmail.value.trim();
  const password = $loginPassword.value;
  if (!email || !password) {
    setLoginError('Email y contraseña requeridos');
    return;
  }
  $loginBtn.disabled = true;
  setLoginError('');
  try {
    await XPD.signIn(email, password);
    // onAuth handler will take over from here
  } catch (e) {
    const code = e.code || '';
    if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) {
      setLoginError('Email o contraseña incorrectos');
    } else {
      setLoginError(`Error: ${code || e.message}`);
    }
  } finally {
    $loginBtn.disabled = false;
  }
});

// Allow pressing Enter in either field to submit
[$loginEmail, $loginPassword].forEach(el => {
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter') $loginBtn.click(); });
});

$signoutBtn.addEventListener('click', async () => {
  if (firebaseUnsubscribe) {
    firebaseUnsubscribe();
    firebaseUnsubscribe = null;
  }
  await XPD.signOutUser();
  // onAuth handler will trigger the login screen
});

XPD.onAuth(async (user) => {
  if (!user) {
    if (firebaseUnsubscribe) {
      firebaseUnsubscribe();
      firebaseUnsubscribe = null;
    }
    showLogin();
    return;
  }

  // Verify kitchen role
  const isKitchenStaff = await XPD.isKitchen(user.uid);
  if (!isKitchenStaff) {
    setLoginError('Esta cuenta no tiene permisos de cocina');
    await XPD.signOutUser();
    return;
  }

  hideLogin();
  startOrdersSubscription();
});

</script>

<div class="archive-drawer" id="history-drawer">
  <div class="archive-header">
    <span class="archive-title">Historial completo de pedidos</span>
    <button class="btn-archive-toggle" onclick="toggleHistory()" style="padding:5px 12px">Cerrar ✕</button>
  </div>
  <div class="archive-body" id="history-body"></div>
</div>

<div class="log-overlay" id="log-overlay" onclick="closeLog(event)">
  <div class="log-modal" id="log-modal">
    <div class="log-modal-title" id="log-modal-title">Historial del pedido</div>
    <div id="log-modal-body"></div>
    <button class="btn-close-log" onclick="closeLog()">Cerrar</button>
  </div>
</div>

<div class="archive-drawer" id="archive-drawer">
  <div class="archive-header">
    <span class="archive-title">Pedidos archivados</span>
    <button class="btn-archive-toggle" onclick="toggleArchive()" style="padding:5px 12px">Cerrar ✕</button>
  </div>
  <div class="archive-body" id="archive-body"></div>
</div>

</body>
