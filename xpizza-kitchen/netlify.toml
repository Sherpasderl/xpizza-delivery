# Netlify config for the kitchen display site
# This file overrides the dashboard settings.
# See: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."
  command = "node ../platform/stamp-version.js"   # P-SELFUPDATE §1: /version.json + identity <meta>; never fails the build
[build.environment]
  # Netlify secrets scanning (it runs because of the build command above) flags these PUBLIC client keys — the Firebase web
  # config and Google Maps keys already committed in this site's JS. Omit EXACTLY these values; scanning stays ON for
  # everything else. Kept equal to the AIza… values in this folder by secrets-scan-omit.guard.test.js.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDWFYrzHvaNnRZERbN8jIuAzkY85daFJXU"

# Static HTML/CSS/JS served as-is; the only build step is the P-SELFUPDATE stamp (adds version.json + <meta> tags).
