# Netlify config for the kitchen display site
# This file overrides the dashboard settings.
# See: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "."
  command = "node ../platform/stamp-version.js"   # P-SELFUPDATE §1: /version.json + identity <meta>; never fails the build

# Static HTML/CSS/JS served as-is; the only build step is the P-SELFUPDATE stamp (adds version.json + <meta> tags).
