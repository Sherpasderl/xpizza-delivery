
[build]
  publish = "."
  # PLAN 4 §3: BAKE this form's menu from its brand's PUBLISHED catalog (a refusal fails the build, nothing written), THEN the
  # P-SELFUPDATE §1 stamp (/version.json + identity <meta>; never fails the build — after the bake, so the hash covers the bytes
  # served), THEN the baked-menu check: this form's baked menu must equal its brand's published catalog or the build FAILS and
  # the previous deploy stays live (owner 2026-10-25, DECISIONS.md; docs/runbooks/form-deploy.md). Every registered form must
  # carry it (form-bundle-live-check.test.js).
  command = "node ../xpizza-functions/tools/bake-form-bundle.js --this-form && node ../platform/stamp-version.js && node ../xpizza-functions/tools/form-bundle-live-check.js --this-form"
[build.environment]
  # Netlify secrets scanning (it runs because of the build command above) flags these PUBLIC client keys — the Firebase web
  # config and Google Maps keys already committed in this site's JS. Omit EXACTLY these values; scanning stays ON for
  # everything else. Kept equal to the AIza… values in this folder by secrets-scan-omit.guard.test.js.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyAuzSLAELV_MaK2xeXrNjS6_lhNXmD_Y0A,AIzaSyDWFYrzHvaNnRZERbN8jIuAzkY85daFJXU"

# Track A (MF1): the profile-claim token travels in the URL FRAGMENT (never sent to servers/Referer). This
# policy is defense-in-depth — no full URL (incl. ?claim=<order_id>) leaks to cross-origin third parties.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"

# PLAN-forms-fonts-preconnect r6.1: the self-hosted fonts are content-hashed (a new file = a new name), so they are cached forever.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
