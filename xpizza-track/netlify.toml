# Netlify config for xpizza-track
# Serves index.html for all routes so /<token> works as a tracking URL.
# The page-side JS extracts the token from window.location.pathname.

[build]
  publish = "."
  command = "node ../platform/stamp-version.js"   # P-SELFUPDATE §1: /version.json + identity <meta>; never fails the build

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
